<style>
/* Layout: one phone-width column. Discover shows one person at a time as a tall scroll of photos and prompt answers. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F2F2; --ink:#0A0A0A; --muted:#6B6B6B; --line:#E3E3E3;
  --accent:#0A0A0A; --accent-ink:#FFFFFF; --accent-soft:#EDEDED;
  --rose:#C0392B; --scrim:rgba(0,0,0,.45); --focus:#8A8A8A; --shadow:0 6px 20px rgba(0,0,0,.16);
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media (min-width:520px){.app{border-inline:1px solid var(--line)}}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;min-height:58px}
.top h1{font:800 26px/1.1 var(--display);margin:0;flex:1;min-width:0;letter-spacing:-.02em}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface-2);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.pill{border:0;font:700 10.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border-radius:999px;background:var(--ink);color:var(--bg);flex:none}
.stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 28px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:18px}
.scroll.roomy{padding-bottom:104px;gap:14px}
.scroll>*,.welcome>*{flex-shrink:0}

.nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 4px}
.nav button{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px 0;color:var(--muted);font:600 11.5px var(--body);position:relative}
.nav svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--ink)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:var(--bg);font:700 11px/18px var(--body);padding:0 5px}

h2{font:700 20px/1.2 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.lbl{font:700 11.5px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.count{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0}

.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px/1.2 var(--body)}
.chip svg{width:14px;height:14px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.sm{padding:5px 11px;font-size:13px;border-color:transparent;background:var(--surface-2)}
.chip.sm.shared{background:var(--ink);color:var(--bg);font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:0;font:600 16px var(--body);text-decoration:none}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--rose);border:1px solid var(--line)}
.btn.link{background:none;min-height:40px;padding:0 4px;color:var(--ink);font-size:15px;text-decoration:underline;text-underline-offset:3px}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}

.av{--s:48px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;font:700 calc(var(--s)*.42)/1 var(--display);color:var(--ink);background:var(--surface-2);flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}

.meter{display:inline-flex;gap:3px;align-items:flex-end;height:14px}
.meter i{width:5px;border-radius:2px;background:var(--line)}
.meter i:nth-child(1){height:5px}.meter i:nth-child(2){height:7px}.meter i:nth-child(3){height:9px}.meter i:nth-child(4){height:11px}.meter i:nth-child(5){height:14px}
.meter i.on{background:var(--ink)}
.lvl{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600}

/* Welcome */
.welcome{flex:1;overflow-y:auto;padding:28px 16px 24px;display:flex;flex-direction:column;gap:26px}
.mark{display:flex;align-items:center;gap:12px}
.mark svg{width:52px;height:52px}
.word{font:800 46px/1 var(--display);letter-spacing:-.03em;margin:0}
.tagline{font:700 24px/1.25 var(--display);margin:0;max-width:16ch;text-wrap:balance;letter-spacing:-.01em}
.hellos{display:flex;flex-wrap:wrap;gap:8px}
.hello{padding:9px 14px;border-radius:18px 18px 18px 4px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.hello:nth-child(3n+2){background:var(--surface-2);border-color:transparent}
.hello:nth-child(4n+3){background:var(--ink);border-color:transparent;color:var(--bg)}

/* Forms */
.field{display:flex;flex-direction:column;gap:8px}
.inp{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0 14px;font:16px var(--body)}
textarea.inp{padding:12px 14px;min-height:96px;resize:vertical;line-height:1.45}
.inp:focus{outline:2px solid var(--ink);outline-offset:0;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1.6fr;gap:12px}
.err{color:var(--rose);font-size:13px;font-weight:600}
.msg{padding:12px 14px;border-radius:14px;font-size:14px}
.msg.bad{border:1px solid var(--rose)}
.msg.ok{background:var(--surface-2)}
.progress{display:flex;gap:6px}
.progress i{height:5px;flex:1;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--ink)}
.lvl-list{display:flex;flex-direction:column;gap:8px}
.lvl-opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.lvl-opt[aria-pressed="true"]{border:2px solid var(--ink);padding:11px 13px}
.lvl-opt b{display:block;font-size:15px}
.lvl-opt span.d{display:block;font-size:13px;color:var(--muted)}
.footer-bar{padding:12px 16px 14px;border-top:1px solid var(--line);background:var(--bg);display:flex;gap:10px}
.footer-bar .btn{flex:1}

/* Photo slots + prompt slots in setup */
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{position:relative;aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:var(--surface-2);border:1px dashed #BDBDBD;display:grid;place-items:center;max-width:100%}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot label{position:absolute;inset:0;display:grid;place-items:center;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;text-align:center;padding:8px}
.slot label svg{width:28px;height:28px;display:block;margin:0 auto 6px}
.slot.filled{border:0}
.slot .x{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#FFFFFF;display:grid;place-items:center}
.slot .x svg{width:16px;height:16px}
.slot .main{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.65);color:#FFFFFF;font:700 10.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-radius:999px}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.pslot{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.pslot.empty{border-style:dashed;color:var(--muted);align-items:center;font-weight:600}
.pslot .t{flex:1;min-width:0}
.pslot svg{width:20px;height:20px;flex:none}
.pslot .q{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.pslot .a{display:block;font:700 18px/1.3 var(--display);overflow-wrap:anywhere}
.plist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.plist button{text-align:left;padding:14px 4px;border:0;border-bottom:1px solid var(--line);background:none;font:600 16px/1.35 var(--body)}

/* Profile (Discover + person view) */
.ph{position:relative;margin:0;border-radius:22px;overflow:hidden;background:var(--surface-2);aspect-ratio:4/5;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .empty-ph{position:absolute;inset:0;display:grid;place-items:center;font:800 120px/1 var(--display);color:#C4C4C4}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:56px 18px 18px;background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,0));color:#FFFFFF;display:flex;flex-direction:column;gap:2px}
.ph .cap .nm{font:800 34px/1.05 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere}
.ph .cap .sub{font-size:15px;font-weight:500;opacity:.92}
.ph.has-cap .hi-btn{bottom:auto;top:14px}
.hi-btn{position:absolute;right:14px;bottom:14px;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:10px 16px;background:#FFFFFF;color:#0A0A0A;font:700 15px/1 var(--body);box-shadow:var(--shadow)}
.hi-btn svg{width:18px;height:18px}
.pcard{position:relative;border:1px solid var(--line);border-radius:22px;padding:22px 20px 70px;background:var(--surface)}
.pcard .q{font-size:14px;font-weight:600;color:var(--muted);margin:0 0 10px}
.pcard .a{font:700 27px/1.2 var(--display);letter-spacing:-.015em;margin:0;overflow-wrap:anywhere;white-space:pre-line}
.pcard.dark{background:var(--ink);border-color:var(--ink)}
.pcard.dark .q{color:#B5B5B5}
.pcard.dark .a{color:#FFFFFF}
.pcard .hi-btn{box-shadow:none;border:1px solid var(--line)}
.pcard.dark .hi-btn{border:0}
.pcard.plain{padding-bottom:22px}
.facts{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:22px;overflow:hidden}
.facts div{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);min-width:0}
.facts div:first-child{border-top:0}
.facts svg{width:20px;height:20px;flex:none}
.facts span{min-width:0;overflow-wrap:anywhere}
.fab{position:absolute;left:16px;bottom:16px;width:60px;height:60px;border-radius:50%;border:1px solid var(--line);background:#FFFFFF;color:#0A0A0A;display:grid;place-items:center;box-shadow:var(--shadow);z-index:5}
.fab svg{width:26px;height:26px}
.fab-lbl{position:absolute;left:84px;bottom:34px;font-size:13px;color:var(--muted);z-index:5;pointer-events:none}
.empty{padding:28px 16px;text-align:center;border:1px dashed var(--line);border-radius:22px;display:flex;flex-direction:column;gap:10px;align-items:center}
.copybox{display:flex;gap:8px;width:100%}
.copybox input{flex:1;min-width:0;font-size:13px;min-height:38px}
.me-hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.me-hero .name{font:800 30px/1.1 var(--display);letter-spacing:-.02em;margin:0}

/* Topics */
.prompt{background:var(--ink);color:var(--bg);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px}
.prompt .lbl{color:#B5B5B5}
.prompt .q{font:700 20px/1.3 var(--display);margin:0;text-wrap:balance}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:9px;font:600 14px var(--body);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.tgl{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px}
.tgl .tr{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .15s}
.tgl .tr::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#FFFFFF;transition:transform .15s}
.tgl[aria-pressed="true"] .tr{background:var(--ink)}
.tgl[aria-pressed="true"] .tr::after{transform:translateX(12px)}
select.inp{min-height:40px;width:auto;border-radius:999px;font-size:14px;padding:0 12px}
.tlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.trow{display:flex;align-items:center;gap:12px;padding:14px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.trow .t{flex:1;min-width:0}
.trow b{display:block;font:700 16px/1.25 var(--display)}
.trow span{font-size:13px;color:var(--muted)}
.tag{font:700 10.5px/1 var(--body);letter-spacing:.07em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);flex:none}
.qs{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:16px}
.phr{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:14px}
.phr b{font-weight:700}
.phr span{font-size:14px;color:var(--muted)}

/* Friends */
.req{border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.req .head{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left;width:100%}
.req .head b{display:block;font:700 18px/1.2 var(--display)}
.req .head span{font-size:13px;color:var(--muted)}
.quote{background:var(--surface-2);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.quote img{width:48px;height:60px;object-fit:cover;border-radius:8px;flex:none}
.quote .q{display:block;font-size:12px;color:var(--muted)}
.quote .a{display:block;font-weight:700;overflow-wrap:anywhere}
.bubble{align-self:flex-start;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:18px 18px 18px 4px;max-width:100%;overflow-wrap:anywhere}
.frow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.frow .who{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.frow .who b{display:block;font:700 16px/1.2 var(--display)}
.frow .who span{font-size:13px;color:var(--muted)}

/* Sheets, toast, misc */
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:20;animation:fade .15s ease}
.sheet{background:var(--surface);width:100%;border-radius:22px 22px 0 0;padding:20px 16px 22px;display:flex;flex-direction:column;gap:12px;max-height:88%;overflow-y:auto;animation:up .2s ease}
.sheet ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes cardin{from{opacity:0;transform:translateY(14px)}}
.card-in{animation:cardin .25s ease}
.spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ink);animation:spin .8s linear infinite}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;text-align:center}
/* Chat */
.chat{flex:1;min-height:0;display:flex;flex-direction:column}
.chat-top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.chat-top .who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.chat-top .who b{font:700 18px/1.2 var(--display);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-top .who span span{font-size:12px;color:var(--muted)}
.msgs{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
.msgs>*{flex-shrink:0}
.m{max-width:78%;padding:10px 14px;border-radius:20px;overflow-wrap:anywhere;white-space:pre-wrap;font-size:16px;line-height:1.4}
.m.them{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.m.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:6px}
.m.pending{opacity:.55}
.m-time{font-size:11px;color:var(--muted);align-self:center;margin:10px 0 2px}
.m-seen{font-size:11px;color:var(--muted);align-self:flex-end}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--line);background:var(--bg)}
.composer textarea{flex:1;min-width:0;min-height:44px;max-height:120px;border-radius:22px;padding:11px 16px;resize:none;line-height:1.35}
.composer .send{width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.composer .send svg{width:20px;height:20px}
.starters{display:flex;flex-direction:column;gap:8px}
.starters button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;font:500 15px/1.35 var(--body)}
.crow{display:flex;align-items:center;gap:12px;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.crow .t{flex:1;min-width:0}
.crow b{display:block;font:700 17px/1.2 var(--display)}
.crow .pv{display:block;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow.unread .pv{color:var(--ink);font-weight:600}
.crow .tm{font-size:12px;color:var(--muted);flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.udot{width:10px;height:10px;border-radius:50%;background:var(--ink)}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px;align-self:center;padding:8px}
.check{display:flex;align-items:center;gap:10px;font-weight:500}
.check input{width:22px;height:22px;accent-color:#0A0A0A}
.slot-tap{position:absolute;inset:0;border:0;padding:0;background:none;display:block;width:100%;height:100%}
.slot .capflag{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:#FFFFFF;font:600 10.5px/1 var(--body);padding:5px 7px;border-radius:999px}
.ph-tap{position:absolute;inset:0;border:0;padding:0;background:none;display:block;width:100%;height:100%;cursor:zoom-in}
.ph .cap,.ph .pcap{pointer-events:none}
.ph .pcap{position:absolute;left:0;right:0;bottom:0;padding:44px 128px 16px 16px;background:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,0));color:#FFFFFF;font-weight:600;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.badge-new{background:#FFFFFF;color:#0A0A0A;font:700 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:999px}
.fab.go{left:auto;right:16px;background:#0A0A0A;color:#FFFFFF;border-color:#0A0A0A}
.stamp{position:absolute;top:96px;z-index:6;padding:8px 14px;border:3px solid;border-radius:12px;font:800 22px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;opacity:0;pointer-events:none;background:#FFFFFF}
.stamp-hi{left:28px;transform:rotate(-12deg);color:#0A0A0A;border-color:#0A0A0A}
.stamp-skip{right:28px;transform:rotate(12deg);color:#C0392B;border-color:#C0392B}
#swipe-card{touch-action:pan-y;will-change:transform;-webkit-user-select:none;user-select:none}
#swipe-card img{-webkit-user-drag:none;user-select:none}
.viewer{position:absolute;inset:0;z-index:40;background:#000000;display:flex;align-items:center;justify-content:center;touch-action:none;animation:fade .15s ease}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.viewer .vb{position:absolute;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#FFFFFF;display:grid;place-items:center}
.viewer .vb svg{width:22px;height:22px}
.v-x{top:12px;right:12px}.v-prev{left:10px;top:calc(50% - 22px)}.v-next{right:10px;top:calc(50% - 22px)}
.v-count{position:absolute;top:24px;left:16px;color:#FFFFFF;font-size:14px;font-weight:600}
.v-cap{position:absolute;left:16px;right:16px;bottom:28px;color:#FFFFFF;margin:0;font-size:16px;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.match{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;padding-top:8px}
.match-avs{display:flex}
.match-avs .av{border:4px solid var(--surface)}
.match-avs .av+.av{margin-left:-20px}
.counter{font-size:12px;color:var(--muted);align-self:flex-end}
.toast{position:absolute;left:16px;right:16px;top:64px;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:14px;font-size:14px;font-weight:500;z-index:30;animation:up .2s ease}
.screen-fade{animation:fade .18s ease}
</style>

<div class="app" id="app"><div class="center"><div class="spinner" role="status" aria-label="Loading"></div></div></div>
<input id="f-photo" class="hidden-input" type="file" accept="image/*" aria-label="Choose a photo">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>

  if(!need.length)return;
  const {data,error}=await sb.storage.from("avatars").createSignedUrls(need,21600);
  if(error||!data)return;
  data.forEach(d=>{if(d&&d.signedUrl&&d.path)S.photoUrls[d.path]=d.signedUrl});
}
function resizeImage(file){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{
    const W=img.naturalWidth,H=img.naturalHeight,target=4/5;
    let sw=W,sh=H;if(W/H>target)sw=Math.round(H*target);else sh=Math.round(W/target);
    const sx=(W-sw)/2,sy=(H-sh)/2,ow=Math.min(1080,sw),oh=Math.round(ow/target);
    const c=document.createElement("canvas");c.width=ow;c.height=oh;
    const g=c.getContext("2d");g.imageSmoothingEnabled=true;g.imageSmoothingQuality="high";g.drawImage(img,sx,sy,sw,sh,0,0,ow,oh);URL.revokeObjectURL(url);
    c.toBlob(b=>b?res({blob:b,preview:c.toDataURL("image/jpeg",0.9)}):rej(new Error("Couldn't read that photo. Try a different one.")),"image/jpeg",0.9);
  };
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("Couldn't read that photo. Try a different one."))};
  img.src=url;
})}
async function loadAll(){
  if(!S.user)return;
  const uid=S.user.id;
  const [pr,cr,mr,br]=await Promise.all([
    sb.from("profiles").select("*").neq("id",uid).order("created_at",{ascending:false}).limit(300),
    sb.from("connections").select("*"),
    sb.from("messages").select("*").order("created_at",{ascending:false}).limit(500),
    sb.from("blocks").select("*")
  ]);
  if(pr.error){toast("Couldn't load people. Check your connection and try again.");return}
  S.blocks=br.error?[]:(br.data||[]);
  const blocked=S.blocks.map(b=>b.blocked_id);
  S.people=(pr.data||[]).map(fromRow).filter(p=>!blocked.includes(p.id));
  S.conns=cr.error?[]:(cr.data||[]);
  if(!mr.error&&mr.data){const pend=S.msgs.filter(m=>m.pending);S.msgs=mr.data.concat(pend)}
  await signPhotos(S.people.flatMap(p=>p.photos));
  S.loaded=true;
  const k=S.route.split(":")[0];
  if(k==="tab"||k==="person")render();
  if(k==="chat")updateChat();
}
let refreshing=false;
async function refresh(){if(refreshing||!S.me)return;refreshing=true;try{await loadAll()}finally{refreshing=false}}

async function onSession(session){
  const uid=session&&session.user?session.user.id:null;
  if(!uid){S.user=null;S.me=null;S.people=[];S.conns=[];S.loaded=false;S.stack=[];if(S.route!=="checkemail")S.route="welcome";render(true);return}
  if(S.user&&S.user.id===uid&&S.me)return;
  S.user=session.user;S.route="loading";render(true);
  const {data,error}=await sb.from("profiles").select("*").eq("id",uid).maybeSingle();
  if(error){showError("We couldn't load your profile. "+error.message);return}
  S.stack=[];loadSkipped();
  if(!data){S.me=null;S.draft=blankDraft();S.editing=false;errs={};S.route="setup1";render(true);return}
  S.me=fromRow(data);await signPhotos(S.me.photos);
  S.route="tab:discover";render(true);loadAll();
}
function showError(t){S.errText=t;S.route="error";render(true)}
function friendlyAuthError(e){
  const m=(e&&e.message||"").toLowerCase();
  if(m.includes("invalid login"))return"That email and password don't match. Check them and try again.";
  if(m.includes("email not confirmed"))return"Please confirm your email first. Open the email from Friendly and tap the link.";
  if(m.includes("rate limit")||m.includes("too many"))return"Too many attempts. Wait a few minutes and try again.";
  if(m.includes("password")&&m.includes("least"))return"Use a password with at least 8 characters.";
  if(m.includes("valid email")||m.includes("invalid email"))return"Enter a valid email address.";
  return(e&&e.message)||"Something went wrong. Try again.";
}

/* ---------- Render ---------- */
function render(top){
  const prev=app.querySelector(".scroll,.welcome");const y=prev&&!top?prev.scrollTop:0;
  const keepToast=app.querySelector(".toast");const keepSheet=app.querySelector(".scrim");
  let [kind,arg]=S.route.split(":");
  const open=["loading","error","welcome","auth","checkemail","newpass"];
  if(!S.user&&!open.includes(kind)){S.route="welcome";kind="welcome"}
  if(S.user&&!S.me&&!["setup1","setupB","setup2","setup3","loading","error","newpass"].includes(kind)){S.route="setup1";kind="setup1"}
  let html="";
  if(kind==="loading")html=`<div class="center"><div class="spinner" role="status" aria-label="Loading"></div></div>`;
  else if(kind==="error")html=`<div class="center"><h2>Something went wrong</h2><p class="muted" style="margin:0">${esc(S.errText)}</p><button class="btn primary" data-a="reload">Try again</button></div>`;
  else if(kind==="welcome")html=vWelcome();
  else if(kind==="auth")html=vAuth();
  else if(kind==="checkemail")html=vCheckEmail();
  else if(kind==="newpass")html=vNewPass();
  else if(kind==="setup1")html=vSetup1();
  else if(kind==="setupB")html=vSetupB();
  else if(kind==="setup2")html=vSetup2();
  else if(kind==="setup3")html=vSetup3();
  else if(kind==="person")html=vPerson(arg);
  else if(kind==="topic")html=vTopic(arg);
  else if(kind==="chat")html=vChat(arg);
  else if(kind==="tab"){html=({discover:vDiscover,topics:vTopics,friends:vFriends,me:vMe}[arg]||vDiscover)();html+=nav(arg)}
  app.innerHTML=html;
  if(keepSheet&&!top)app.appendChild(keepSheet);
  if(keepToast)app.appendChild(keepToast);
  const sc=app.querySelector(".scroll,.welcome");if(sc){sc.scrollTop=y;if(top)sc.classList.add("screen-fade")}
  if(kind==="setup3")applyChipSearch("i-search",".igroup","i-none");
  if(S.route==="tab:discover")bindSwipe();
  if(S.route.startsWith("chat:")){const box=document.getElementById("msgs");if(box)box.scrollTop=box.scrollHeight;autoGrow(document.getElementById("m-text"));markRead(arg)}
  setPolling();
}
let pollT=null,pollRoute="";
function setPolling(){
  if(pollRoute===S.route)return;pollRoute=S.route;clearInterval(pollT);pollT=null;
  if(S.route.startsWith("chat:")){const cid=S.route.split(":")[1];pollChat(cid);pollT=setInterval(()=>pollChat(cid),4000)}
  else if(S.route==="tab:friends")pollT=setInterval(refresh,15000);
}
async function pollChat(cid){
  if(document.visibilityState!=="visible"||S.route!=="chat:"+cid)return;
  const {data,error}=await sb.from("messages").select("*").eq("connection_id",cid).order("created_at",{ascending:true}).limit(500);
  if(error||!data||S.route!=="chat:"+cid)return;
  const pend=S.msgs.filter(m=>m.pending&&m.connection_id===cid);
  S.msgs=S.msgs.filter(m=>m.connection_id!==cid).concat(data,pend);
  updateChat();markRead(cid);
}
async function markRead(cid){
  const now=new Date().toISOString();
  const ids=S.msgs.filter(m=>m.connection_id===cid&&m.sender_id!==myId()&&!m.read_at&&!m.pending).map(m=>m.id);
  if(!ids.length)return;
  S.msgs.forEach(m=>{if(ids.includes(m.id))m.read_at=now});
  await sb.from("messages").update({read_at:now}).in("id",ids);
}
function updateChat(force){
  if(!S.route.startsWith("chat:"))return;
  const cid=S.route.split(":")[1];const c=connById(cid);
  if(!c||c.status!=="accepted"){S.stack=[];S.route="tab:friends";render(true);toast("This chat is no longer available.");return}
  const box=document.getElementById("msgs");if(!box)return;
  const near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
  box.innerHTML=msgsHtml(cid);
  if(force||near)box.scrollTop=box.scrollHeight;
}
function autoGrow(ta){if(!ta)return;ta.style.height="auto";ta.style.height=Math.min(120,ta.scrollHeight)+"px"}

/* ---------- Profile building blocks ---------- */
function photoBlock(p,i,opts){
  const path=p.photos[i],src=photoSrc(path),first=i===0,capText=(p.captions||[])[i]||"";
  let badges="";
  if(first){
   const c=opts.hi?connWith(p.id):null;
   const b=[];if(c&&c.to_id===myId()&&c.status==="pending")b.push("Said hi to you");if(p.d&&NEW_SINCE.includes(p.d.since))b.push("New to Australia");
   badges=b.length?`<span class="badges">${b.map(x=>`<span class="badge-new">${x}</span>`).join("")}</span>`:"";
  }
  const cap=first?`<figcaption class="cap">${badges}<span class="nm">${esc(p.name)}, ${esc(p.age)}</span>${p.city?`<span class="sub">${esc(p.city)}</span>`:""}</figcaption>`:(capText?`<figcaption class="pcap">${esc(capText)}</figcaption>`:"");
  const hi=opts.hi?`<button class="hi-btn" data-a="sayhi" data-v="${esc(p.id)}|photo|${i}" aria-label="Say hi to ${esc(p.name)}'s photo">${ICON.hi}Say hi</button>`:"";
  const inner=src?`<button class="ph-tap" data-a="viewphoto" data-v="${esc(p.id)}|${i}" aria-label="View photo ${i+1} full screen"><img src="${esc(src)}" alt="${first?esc(p.name):esc(capText)}" loading="${first?"eager":"lazy"}"></button>`:`<div class="empty-ph" aria-hidden="true">${esc((p.name||"?").charAt(0).toUpperCase())}</div>`;
  return`<figure class="ph ${first?"has-cap":""}">${inner}${cap}${hi}</figure>`;
}
function promptBlock(p,i,opts,dark){
  const pr=p.prompts[i];
  const hi=opts.hi?`<button class="hi-btn" data-a="sayhi" data-v="${esc(p.id)}|prompt|${i}">${ICON.hi}Say hi</button>`:"";
  return`<section class="pcard ${dark?"dark":""} ${opts.hi?"":"plain"}"><p class="q">${esc(pr.q)}</p><p class="a">${esc(pr.a)}</p>${hi}</section>`;
}
function factsBlock(p){
  const rows=[],d=p.d||{};
  if(p.level!=null)rows.push(`<div>${meter(p.level)}<span class="muted" style="font-size:13px">English</span></div>`);
  if(p.langs.length)rows.push(`<div>${ICON.globe}<span>Speaks ${esc(p.langs.join(", "))}</span></div>`);
  if(d.learning&&d.learning.length)rows.push(`<div>${ICON.learn}<span>Learning ${esc(d.learning.join(", "))}</span></div>`);
  if(d.from)rows.push(`<div>${ICON.home}<span>From ${esc(d.from)}</span></div>`);
  if(d.since)rows.push(`<div>${ICON.clock}<span>${d.since==="Born here"?"Born in Australia":"In Australia "+esc(d.since.charAt(0).toLowerCase()+d.since.slice(1))}</span></div>`);
  if(p.city)rows.push(`<div>${ICON.pin}<span>Lives in ${esc(p.city)}</span></div>`);
  if(d.work)rows.push(`<div>${ICON.work}<span>${esc(d.work)}</span></div>`);
  if(d.study)rows.push(`<div>${ICON.study}<span>${esc(d.study)}</span></div>`);
  if(p.connect.length)rows.push(`<div>${ICON.chat}<span>Likes ${esc(p.connect.join(", ").toLowerCase())}</span></div>`);
  return rows.length?`<div class="facts">${rows.join("")}</div>`:"";
}
function chipsCard(title,items){return items&&items.length?`<section class="pcard plain"><p class="q">${title}</p><div class="wrap">${items.map(i=>`<span class="chip sm">${esc(i)}</span>`).join("")}</div></section>`:""}
function interestsBlock(p){
  const sh=p.id===myId()?[]:shared(p),rest=p.interests.filter(i=>!sh.includes(i));
  return`<section class="pcard plain"><p class="q">${sh.length?`Interests · ${sh.length} in common with you`:"Interests"}</p><div class="wrap">${sh.map(i=>`<span class="chip sm shared">${ICON.check}${esc(i)}</span>`).join("")}${rest.map(i=>`<span class="chip sm">${esc(i)}</span>`).join("")}</div></section>`;
}
function profileBody(p,opts){
  const d=p.d||{},out=[photoBlock(p,0,opts),factsBlock(p)];
  if(p.prompts[0])out.push(promptBlock(p,0,opts,true));
  if(p.photos[1])out.push(photoBlock(p,1,opts));
  if(p.intro)out.push(`<section class="pcard plain"><p class="q">About me</p><p class="a" style="font-size:19px;font-weight:600;line-height:1.4">${esc(p.intro)}</p></section>`);
  out.push(chipsCard("Looking for",d.looking));
  if(p.photos[2])out.push(photoBlock(p,2,opts));
  if(p.prompts[1])out.push(promptBlock(p,1,opts,false));
  out.push(interestsBlock(p));
  if(p.photos[3])out.push(photoBlock(p,3,opts));
  out.push(chipsCard("Personality",(d.traits||[]).concat(d.sign?[d.sign]:[])));
  if(p.prompts[2])out.push(promptBlock(p,2,opts,true));
  if(p.photos[4])out.push(photoBlock(p,4,opts));
  if(p.photos[5])out.push(photoBlock(p,5,opts));
  return out.filter(Boolean).join("");
}

function queue(){
 const f=S.f,me=S.me;
 return S.people
  .filter(p=>{const c=connWith(p.id);return(!c||(c.to_id===myId()&&c.status==="pending"))&&!S.skipped.includes(p.id)&&!S.swiped.includes(p.id)})
  .filter(p=>!f.interests.length||p.interests.some(i=>f.interests.includes(i)))
  .filter(p=>!f.lang||p.langs.includes(f.lang))
  .filter(p=>!f.city||(me.city&&p.city.toLowerCase()===me.city.trim().toLowerCase()))
  .filter(p=>!f.level||me.level==null||p.level==null||Math.abs(p.level-me.level)<=1)
  .sort((a,b)=>{const ia=connWith(a.id)?1:0,ib=connWith(b.id)?1:0;return ib-ia||shared(b).length-shared(a).length});
}
const activeFilters=()=>S.f.interests.length+(S.f.lang?1:0)+(S.f.city?1:0)+(S.f.level?1:0);

const toggle=(arr,v)=>{const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1)};
function readDraft(){app.querySelectorAll("[data-f]").forEach(el=>{S.draft[el.dataset.f]=el.value})}
function readAuth(){app.querySelectorAll("[data-af]").forEach(el=>{S.auth[el.dataset.af]=el.value})}

async function submitAuth(){
 readAuth();const a=S.auth;a.msg=null;
 const email=a.email.trim(),pw=a.password;
 if(!/^\S+@\S+\.\S+$/.test(email)){a.msg={text:"Enter a valid email address."};render();return}
 if(pw.length<8){a.msg={text:"Use a password with at least 8 characters."};render();return}
 a.busy=true;render();
 try{
  if(a.mode==="signup"){
   const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:appUrl()}});
   if(error)throw error;
   a.password="";
   if(!data.session){S.stack=[];S.route="checkemail";render(true)}
  }else{
   const {error}=await sb.auth.signInWithPassword({email,password:pw});
   if(error)throw error;
   a.password="";
  }
 }catch(e){a.msg={text:friendlyAuthError(e)}}
 a.busy=false;if(S.route==="auth")render();
}
async function submitNewPass(){
 readAuth();const a=S.auth;a.msg=null;
 if(a.password.length<8){a.msg={text:"Use a password with at least 8 characters."};render();return}
 a.busy=true;render();
 const {error}=await sb.auth.updateUser({password:a.password});
 a.busy=false;a.password="";
 if(error){a.msg={text:friendlyAuthError(error)};render();return}
 toast("Password updated.");S.route="loading";render(true);
 const {data}=await sb.auth.getSession();S.me=null;S.user=null;onSession(data.session);
}

async function sendHi(pid,item){
 const ta=document.getElementById("hi-msg");const message=ta?ta.value.trim():"";
 const btn=app.querySelector('[data-a="dosendhi"]');if(btn){btn.disabled=true;btn.textContent="Sending…"}
 const ex=connWith(pid);
 if(ex&&ex.to_id===myId()&&ex.status==="pending"){
  closeSheet();const ok=await acceptConn(ex);if(!ok)return;
  if(message){const {data:m}=await sb.from("messages").insert({connection_id:ex.id,sender_id:myId(),body:message}).select().single();if(m)S.msgs.push(m)}
  S.swiped.push(pid);render(true);showMatch(person(pid),ex.id);return;
 }
 const {data,error}=await sb.from("connections").insert({from_id:myId(),to_id:pid,liked_item:item||null,message:message||null}).select().single();
 if(error){
  if(btn){btn.disabled=false;btn.textContent="Send hi"}
  if(error.code==="23505"){closeSheet();toast("You're already connected with this person. Check your Chats tab.");refresh();return}
  toast("Couldn't send: "+error.message);return;
 }
 S.conns.push(data);closeSheet();
 const p=person(pid);
 if(S.route.startsWith("person:"))render();else render(true);
 toast(`Hi sent to ${p?p.name:"them"}. If they say hi back, you'll be friends.`);
}
async function acceptConn(c){
 const {error}=await sb.from("connections").update({status:"accepted",responded_at:new Date().toISOString()}).eq("id",c.id);
 if(error){toast("Couldn't connect: "+error.message);return false}
 c.status="accepted";return true;
}

  <button class="btn primary block" data-a="matchchat" data-v="${esc(cid)}">${ICON.chat}Send a message</button>
  <button class="btn ghost block" data-a="close">Keep swiping</button></div>`);
}
async function swipeRight(pid){
 const p=person(pid);if(!p)return;
 S.swiped.push(pid);render(true);
 const c=connWith(pid);
 if(c&&c.to_id===myId()&&c.status==="pending"){if(await acceptConn(c)){render(true);showMatch(p,c.id)}return}
 if(c)return;
 const {data,error}=await sb.from("connections").insert({from_id:myId(),to_id:pid}).select().single();
 if(error){
  if(error.code==="23505"){refresh();return}
  S.swiped=S.swiped.filter(x=>x!==pid);render(true);toast("Couldn't send: "+error.message);return;
 }
 S.conns.push(data);if(S.route==="tab:discover")render();
 toast(`Hi sent to ${p.name}. If they say hi back, you'll be friends.`);
}

function bindSwipe(){

 const pid=card.dataset.pid,hiS=app.querySelector(".stamp-hi"),skS=app.querySelector(".stamp-skip");
 let sx=0,sy=0,dx=0,down=false,decided=false,dragging=false,done=false;
 const setStamps=x=>{if(hiS)hiS.style.opacity=Math.max(0,Math.min(1,x/100));if(skS)skS.style.opacity=Math.max(0,Math.min(1,-x/100))};
 fling=dir=>{if(done)return;done=true;card.style.transition="transform .28s ease, opacity .28s ease";card.style.transform=`translateX(${dir*130}%) rotate(${dir*16}deg)`;card.style.opacity="0";setStamps(dir*120);
  setTimeout(()=>{if(dir>0)swipeRight(pid);else A.skip(pid)},230)};
 card.addEventListener("pointerdown",e=>{if(done||(e.pointerType==="mouse"&&e.button!==0))return;down=true;decided=false;dragging=false;sx=e.clientX;sy=e.clientY;dx=0;card.style.transition="none"});
 card.addEventListener("pointermove",e=>{
  if(!down||done)return;const mx=e.clientX-sx,my=e.clientY-sy;
  if(!decided&&(Math.abs(mx)>10||Math.abs(my)>10)){decided=true;dragging=Math.abs(mx)>Math.abs(my)*1.2;if(dragging){try{card.setPointerCapture(e.pointerId)}catch(_){}}}
  if(dragging){dx=mx;card.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;setStamps(dx)}
 });
 const end=()=>{
  if(!down)return;down=false;if(!dragging||done)return;
  S.swallowUntil=Date.now()+350;
  if(dx>110)fling(1);else if(dx<-110)fling(-1);else{card.style.transition="transform .2s ease";card.style.transform="";setStamps(0)}
 };
 card.addEventListener("pointerup",end);card.addEventListener("pointercancel",end);
 card.addEventListener("dragstart",e=>e.preventDefault());
}
function drawViewer(){
 document.querySelectorAll(".viewer").forEach(v=>v.remove());
 const st=S.viewer;if(!st)return;const p=person(st.pid);if(!p){S.viewer=null;return}
 const n=p.photos.length,i=Math.max(0,Math.min(n-1,st.i));st.i=i;
 const src=photoSrc(p.photos[i]),cap=(p.captions||[])[i]||"";
 const v=document.createElement("div");v.className="viewer";v.setAttribute("role","dialog");v.setAttribute("aria-modal","true");v.setAttribute("aria-label",`${p.name}'s photos`);
 v.innerHTML=`${src?`<img src="${esc(src)}" alt="${esc(cap||p.name)}">`:""}<span class="v-count">${i+1} / ${n}</span>${cap?`<p class="v-cap">${esc(cap)}</p>`:""}
  <button class="vb v-x" data-a="vclose" aria-label="Close">${ICON.x}</button>${i>0?`<button class="vb v-prev" data-a="vprev" aria-label="Previous photo">${ICON.back}</button>`:""}${i<n-1?`<button class="vb v-next" data-a="vnext" aria-label="Next photo">${ICON.chev}</button>`:""}`;
 let sx=0,on=false;
 v.addEventListener("pointerdown",e=>{sx=e.clientX;on=true});
 v.addEventListener("pointerup",e=>{if(!on)return;on=false;const d=e.clientX-sx;if(d<-50&&i<n-1){st.i++;drawViewer()}else if(d>50&&i>0){st.i--;drawViewer()}});
 app.appendChild(v);const x=v.querySelector(".v-x");x&&x.focus();
}

async function sendMsg(){

 const body=ta.value.trim();if(!body)return;
 ta.value="";S.drafts[cid]="";autoGrow(ta);ta.focus();
 const temp={id:"tmp"+Date.now(),connection_id:cid,sender_id:myId(),body,created_at:new Date().toISOString(),read_at:null,pending:true};
 S.msgs.push(temp);updateChat(true);
 const {data,error}=await sb.from("messages").insert({connection_id:cid,sender_id:myId(),body}).select().single();
 S.msgs=S.msgs.filter(m=>m!==temp);

async function doBlock(pid,quiet){
 const p=person(pid);
 const {error}=await sb.from("blocks").insert({blocker_id:myId(),blocked_id:pid,blocked_name:p?p.name:null});
 if(error&&error.code!=="23505"){toast("Couldn't block: "+error.message);return false}
 const c=connWith(pid);if(c)await sb.from("connections").delete().eq("id",c.id);
 S.blocks.push({blocker_id:myId(),blocked_id:pid,blocked_name:p?p.name:null});
 if(c){S.conns=S.conns.filter(x=>x.id!==c.id);S.msgs=S.msgs.filter(m=>m.connection_id!==c.id)}
 S.people=S.people.filter(x=>x.id!==pid);
 closeSheet();
 if(!S.route.startsWith("tab:discover")){S.stack=[];S.route="tab:friends"}
 render(true);
 if(!quiet)toast(`${p?p.name:"They"} ${p?"is":"are"} blocked. They won't be told.`);
 return true;
}

 copylink:async()=>{const inp=document.getElementById("invite-url");try{await navigator.clipboard.writeText(appUrl());toast("Link copied.")}catch(e){if(inp){inp.focus();inp.select()}toast("Press and hold the link to copy it.")}},
 askdelete:()=>sheet(`<h2>Delete your profile?</h2><p style="margin:0">Your profile, photos and hellos will be removed and no one will see them. You'll be logged out. You can make a new profile later by logging in again.</p><button class="btn danger block" data-a="dodelete">Delete profile</button><button class="btn ghost block" data-a="close">Cancel</button>`),
 dodelete:async()=>{
  closeSheet();
  const uid=myId();
  const {data:files}=await sb.storage.from("avatars").list(uid);
  if(files&&files.length)await sb.storage.from("avatars").remove(files.map(f=>uid+"/"+f.name));
  const {error}=await sb.from("profiles").delete().eq("id",uid);
  if(error){toast("Couldn't delete: "+error.message);return}
  S.me=null;await sb.auth.signOut();toast("Your profile was deleted.");
 }
};

app.addEventListener("click",e=>{if(Date.now()<S.swallowUntil){e.preventDefault();e.stopPropagation();return}const t=e.target.closest("[data-a]");if(!t||t.disabled)return;const fn=A[t.dataset.a];if(fn){e.preventDefault();fn(t.dataset.v,t,e)}});
app.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="authform")submitAuth();if(e.target.id==="passform")submitNewPass();if(e.target.id==="composer")sendMsg()});
app.addEventListener("keydown",e=>{if(e.target.id==="m-text"&&e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMsg()}});
app.addEventListener("change",e=>{if(e.target.id==="f-lang"){S.f.lang=e.target.value}});
app.addEventListener("input",e=>{
 const f=e.target.dataset&&e.target.dataset.f;if(f){S.draft[f]=e.target.value}
 const af=e.target.dataset&&e.target.dataset.af;if(af){S.auth[af]=e.target.value}
 if(e.target.id==="i-search"){S.iq=e.target.value;applyChipSearch("i-search",".igroup","i-none")}
 if(e.target.id==="fi-search")applyChipSearch("fi-search",".fgroup","fi-none",c=>c.dataset.mine==="1");
 if(e.target.id==="f-intro"){const c=document.getElementById("bio-count");if(c)c.textContent=e.target.value.length+" / "+BIO_MAX}
 if(e.target.id==="m-text"){S.drafts[S.route.split(":")[1]]=e.target.value;autoGrow(e.target)}
 if(e.target.id==="p-ans"){const c=document.getElementById("p-count");if(c)c.textContent=e.target.value.length+" / "+ANSWER_MAX}
});
fileInput.addEventListener("change",()=>{
 const f=fileInput.files&&fileInput.files[0];fileInput.value="";
 if(!f)return;
 if(S.draft.photos.length>=MAX_PHOTOS){toast("You can add up to 4 photos.");return}
 if(f.type&&!/^image\//.test(f.type)){toast("Choose a photo file.");return}
 resizeImage(f).then(r=>{S.draft.photos.push({blob:r.blob,preview:r.preview});render()}).catch(err=>toast(err.message));
});
document.addEventListener("keydown",e=>{
 if(S.viewer){if(e.key==="Escape"){A.vclose()}else if(e.key==="ArrowLeft"){A.vprev()}else if(e.key==="ArrowRight"){A.vnext()}return}
 if(e.key==="Escape")closeSheet();
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refresh()});

/* ---------- Start ---------- */
sb.auth.onAuthStateChange((event,session)=>{
 // Run outside the callback so Supabase calls inside onSession don't block it.
 setTimeout(()=>{
  if(event==="PASSWORD_RECOVERY"){S.user=session&&session.user;S.auth.msg=null;S.auth.password="";S.route="newpass";render(true);return}
  if(S.route==="newpass")return;
  if(event==="SIGNED_IN"||event==="SIGNED_OUT"||event==="INITIAL_SESSION")onSession(session);
 },0);
});
})();
</script>
