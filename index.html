<style>
/* Layout: one phone-width column. Discover shows one person at a time as a tall scroll of photos and prompt answers. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F2F2; --ink:#0A0A0A; --muted:#6B6B6B; --line:#E3E3E3;
  --accent:#0A0A0A; --accent-ink:#FFFFFF; --accent-soft:#EDEDED;
  --rose:#C0392B; --scrim:rgba(0,0,0,.45); --focus:#8A8A8A; --shadow:0 6px 20px rgba(0,0,0,.16);
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media (min-width:520px){.app{border-inline:1px solid var(--line)}}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;min-height:58px}
.top h1{font:800 26px/1.1 var(--display);margin:0;flex:1;min-width:0;letter-spacing:-.02em}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface-2);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.pill{border:0;font:700 10.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border-radius:999px;background:var(--ink);color:var(--bg);flex:none}
.stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 28px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:18px}
.scroll.roomy{padding-bottom:104px;gap:14px}
.scroll>*,.welcome>*{flex-shrink:0}

.nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 4px}
.nav button{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px 0;color:var(--muted);font:600 11.5px var(--body);position:relative}
.nav svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--ink)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:var(--bg);font:700 11px/18px var(--body);padding:0 5px}

h2{font:700 20px/1.2 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.lbl{font:700 11.5px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.count{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0}

.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px/1.2 var(--body)}
.chip svg{width:14px;height:14px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.sm{padding:5px 11px;font-size:13px;border-color:transparent;background:var(--surface-2)}
.chip.sm.shared{background:var(--ink);color:var(--bg);font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:0;font:600 16px var(--body);text-decoration:none}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--rose);border:1px solid var(--line)}
.btn.link{background:none;min-height:40px;padding:0 4px;color:var(--ink);font-size:15px;text-decoration:underline;text-underline-offset:3px}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}

.av{--s:48px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;font:700 calc(var(--s)*.42)/1 var(--display);color:var(--ink);background:var(--surface-2);flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}

.meter{display:inline-flex;gap:3px;align-items:flex-end;height:14px}
.meter i{width:5px;border-radius:2px;background:var(--line)}
.meter i:nth-child(1){height:5px}.meter i:nth-child(2){height:7px}.meter i:nth-child(3){height:9px}.meter i:nth-child(4){height:11px}.meter i:nth-child(5){height:14px}
.meter i.on{background:var(--ink)}
.lvl{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600}

/* Welcome */
.welcome{flex:1;overflow-y:auto;padding:28px 16px 24px;display:flex;flex-direction:column;gap:26px}
.mark{display:flex;align-items:center;gap:12px}
.mark svg{width:52px;height:52px}
.word{font:800 46px/1 var(--display);letter-spacing:-.03em;margin:0}
.tagline{font:700 24px/1.25 var(--display);margin:0;max-width:16ch;text-wrap:balance;letter-spacing:-.01em}
.hellos{display:flex;flex-wrap:wrap;gap:8px}
.hello{padding:9px 14px;border-radius:18px 18px 18px 4px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.hello:nth-child(3n+2){background:var(--surface-2);border-color:transparent}
.hello:nth-child(4n+3){background:var(--ink);border-color:transparent;color:var(--bg)}

/* Forms */
.field{display:flex;flex-direction:column;gap:8px}
.inp{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0 14px;font:16px var(--body)}
textarea.inp{padding:12px 14px;min-height:96px;resize:vertical;line-height:1.45}
.inp:focus{outline:2px solid var(--ink);outline-offset:0;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1.6fr;gap:12px}
.err{color:var(--rose);font-size:13px;font-weight:600}
.msg{padding:12px 14px;border-radius:14px;font-size:14px}
.msg.bad{border:1px solid var(--rose)}
.msg.ok{background:var(--surface-2)}
.progress{display:flex;gap:6px}
.progress i{height:5px;flex:1;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--ink)}
.lvl-list{display:flex;flex-direction:column;gap:8px}
.lvl-opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.lvl-opt[aria-pressed="true"]{border:2px solid var(--ink);padding:11px 13px}
.lvl-opt b{display:block;font-size:15px}
.lvl-opt span.d{display:block;font-size:13px;color:var(--muted)}
.footer-bar{padding:12px 16px 14px;border-top:1px solid var(--line);background:var(--bg);display:flex;gap:10px}
.footer-bar .btn{flex:1}

/* Photo slots + prompt slots in setup */
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.slot{position:relative;aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:var(--surface-2);border:1px dashed #BDBDBD;display:grid;place-items:center;max-width:100%}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot label{position:absolute;inset:0;display:grid;place-items:center;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;text-align:center;padding:8px}
.slot label svg{width:28px;height:28px;display:block;margin:0 auto 6px}
.slot.filled{border:0}
.slot .x{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#FFFFFF;display:grid;place-items:center}
.slot .x svg{width:16px;height:16px}
.slot .main{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.65);color:#FFFFFF;font:700 10.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-radius:999px}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.pslot{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.pslot.empty{border-style:dashed;color:var(--muted);align-items:center;font-weight:600}
.pslot .t{flex:1;min-width:0}
.pslot svg{width:20px;height:20px;flex:none}
.pslot .q{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.pslot .a{display:block;font:700 18px/1.3 var(--display);overflow-wrap:anywhere}
.plist{display:flex;flex-direction:column;border-top:1px solid var(--line)}

function sheet(html){closeSheet();const s=document.createElement("div");s.className="scrim";s.dataset.a="scrim";s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;app.appendChild(s);const f=s.querySelector("textarea,button");f&&f.focus()}
function closeSheet(){document.querySelectorAll(".scrim").forEach(s=>s.remove())}

function header(title,opts){opts=opts||{};return`<header class="top">${opts.back?`<button class="icon-btn" data-a="back" aria-label="Back">${ICON.back}</button>`:""}<h1>${title}</h1>${opts.right||""}<button class="pill" data-a="about">Test version</button></header>`}
function nav(active){const n=incoming().length;const items=[["discover","Discover"],["topics","Topics"],["friends","Friends"],["me","Me"]];return`<nav class="nav" aria-label="Main">${items.map(([k,l])=>`<button data-a="tab" data-v="${k}" ${active===k?'aria-current="page"':""}>${ICON[k]}<span>${l}</span>${k==="friends"&&n?`<span class="badge">${n}</span>`:""}</button>`).join("")}</nav>`}

/* ---------- Data ---------- */
async function signPhotos(paths){
  const need=[...new Set(paths.filter(p=>p&&!S.photoUrls[p]))];
  if(!need.length)return;
  const {data,error}=await sb.storage.from("avatars").createSignedUrls(need,21600);
  if(error||!data)return;
  data.forEach(d=>{if(d&&d.signedUrl&&d.path)S.photoUrls[d.path]=d.signedUrl});
}
function resizeImage(file){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{
    const W=img.naturalWidth,H=img.naturalHeight,target=4/5;
    let sw=W,sh=H;if(W/H>target)sw=Math.round(H*target);else sh=Math.round(W/target);
    const sx=(W-sw)/2,sy=(H-sh)/2,ow=Math.min(800,sw),oh=Math.round(ow/target);
    const c=document.createElement("canvas");c.width=ow;c.height=oh;
    c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,ow,oh);URL.revokeObjectURL(url);
    c.toBlob(b=>b?res({blob:b,preview:c.toDataURL("image/jpeg",0.85)}):rej(new Error("Couldn't read that photo. Try a different one.")),"image/jpeg",0.85);
  };
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("Couldn't read that photo. Try a different one."))};
  img.src=url;
})}
async function loadAll(){
  if(!S.user)return;
  const uid=S.user.id;
  const [pr,cr]=await Promise.all([
    sb.from("profiles").select("*").neq("id",uid).order("created_at",{ascending:false}).limit(300),
    sb.from("connections").select("*")
  ]);
  if(pr.error){toast("Couldn't load people. Check your connection and try again.");return}
  S.people=(pr.data||[]).map(fromRow);
  S.conns=cr.error?[]:(cr.data||[]);
  await signPhotos(S.people.flatMap(p=>p.photos));
  S.loaded=true;
  const k=S.route.split(":")[0];
  if(k==="tab"||k==="person")render();
}
let refreshing=false;
async function refresh(){if(refreshing||!S.me)return;refreshing=true;try{await loadAll()}finally{refreshing=false}}

async function onSession(session){
  const uid=session&&session.user?session.user.id:null;
  if(!uid){S.user=null;S.me=null;S.people=[];S.conns=[];S.loaded=false;S.stack=[];if(S.route!=="checkemail")S.route="welcome";render(true);return}
  if(S.user&&S.user.id===uid&&S.me)return;
  S.user=session.user;S.route="loading";render(true);
  const {data,error}=await sb.from("profiles").select("*").eq("id",uid).maybeSingle();
  if(error){showError("We couldn't load your profile. "+error.message);return}
  S.stack=[];loadSkipped();
  if(!data){S.me=null;S.draft=blankDraft();S.editing=false;errs={};S.route="setup1";render(true);return}
  S.me=fromRow(data);await signPhotos(S.me.photos);
  S.route="tab:discover";render(true);loadAll();
}
function showError(t){S.errText=t;S.route="error";render(true)}
function friendlyAuthError(e){
  const m=(e&&e.message||"").toLowerCase();
  if(m.includes("invalid login"))return"That email and password don't match. Check them and try again.";
  if(m.includes("email not confirmed"))return"Please confirm your email first. Open the email from Friendly and tap the link.";
  if(m.includes("rate limit")||m.includes("too many"))return"Too many attempts. Wait a few minutes and try again.";
  if(m.includes("password")&&m.includes("least"))return"Use a password with at least 8 characters.";
  if(m.includes("valid email")||m.includes("invalid email"))return"Enter a valid email address.";
  return(e&&e.message)||"Something went wrong. Try again.";
}

/* ---------- Render ---------- */
function render(top){
  const prev=app.querySelector(".scroll,.welcome");const y=prev&&!top?prev.scrollTop:0;
  const keepToast=app.querySelector(".toast");const keepSheet=app.querySelector(".scrim");
  let [kind,arg]=S.route.split(":");
  const open=["loading","error","welcome","auth","checkemail","newpass"];
  if(!S.user&&!open.includes(kind)){S.route="welcome";kind="welcome"}
  if(S.user&&!S.me&&!["setup1","setup2","setup3","loading","error","newpass"].includes(kind)){S.route="setup1";kind="setup1"}
  let html="";
  if(kind==="loading")html=`<div class="center"><div class="spinner" role="status" aria-label="Loading"></div></div>`;
  else if(kind==="error")html=`<div class="center"><h2>Something went wrong</h2><p class="muted" style="margin:0">${esc(S.errText)}</p><button class="btn primary" data-a="reload">Try again</button></div>`;
  else if(kind==="welcome")html=vWelcome();
  else if(kind==="auth")html=vAuth();
  else if(kind==="checkemail")html=vCheckEmail();
  else if(kind==="newpass")html=vNewPass();
  else if(kind==="setup1")html=vSetup1();
  else if(kind==="setup2")html=vSetup2();
  else if(kind==="setup3")html=vSetup3();
  else if(kind==="person")html=vPerson(arg);
  else if(kind==="topic")html=vTopic(arg);
  else if(kind==="tab"){html=({discover:vDiscover,topics:vTopics,friends:vFriends,me:vMe}[arg]||vDiscover)();html+=nav(arg)}
  app.innerHTML=html;
  if(keepSheet&&!top)app.appendChild(keepSheet);
  if(keepToast)app.appendChild(keepToast);
  const sc=app.querySelector(".scroll,.welcome");if(sc){sc.scrollTop=y;if(top)sc.classList.add("screen-fade")}
}

/* ---------- Profile building blocks ---------- */
function photoBlock(p,i,opts){
  const path=p.photos[i],src=photoSrc(path),first=i===0;
  const cap=first?`<figcaption class="cap"><span class="nm">${esc(p.name)}, ${esc(p.age)}</span>${p.city?`<span class="sub">${esc(p.city)}</span>`:""}</figcaption>`:"";
  const hi=opts.hi?`<button class="hi-btn" data-a="sayhi" data-v="${esc(p.id)}|photo|${i}" aria-label="Say hi to ${esc(p.name)}'s photo">${ICON.hi}Say hi</button>`:"";
  const inner=src?`<img src="${esc(src)}" alt="${first?esc(p.name):""}" loading="${first?"eager":"lazy"}">`:`<div class="empty-ph" aria-hidden="true">${esc((p.name||"?").charAt(0).toUpperCase())}</div>`;
  return`<figure class="ph ${first?"has-cap":""}">${inner}${cap}${hi}</figure>`;
}
function promptBlock(p,i,opts,dark){
  const pr=p.prompts[i];
  const hi=opts.hi?`<button class="hi-btn" data-a="sayhi" data-v="${esc(p.id)}|prompt|${i}">${ICON.hi}Say hi</button>`:"";
  return`<section class="pcard ${dark?"dark":""} ${opts.hi?"":"plain"}"><p class="q">${esc(pr.q)}</p><p class="a">${esc(pr.a)}</p>${hi}</section>`;
}
function factsBlock(p){
  const rows=[];
  if(p.level!=null)rows.push(`<div>${meter(p.level)}<span class="muted" style="font-size:13px">English</span></div>`);
  if(p.langs.length)rows.push(`<div>${ICON.globe}<span>Speaks ${esc(p.langs.join(", "))}</span></div>`);
  if(p.city)rows.push(`<div>${ICON.pin}<span>${esc(p.city)}</span></div>`);
  if(p.connect.length)rows.push(`<div>${ICON.chat}<span>Likes ${esc(p.connect.join(", ").toLowerCase())}</span></div>`);
  return rows.length?`<div class="facts">${rows.join("")}</div>`:"";
}
function interestsBlock(p){
  const sh=p.id===myId()?[]:shared(p),rest=p.interests.filter(i=>!sh.includes(i));
  return`<section class="pcard plain"><p class="q">${sh.length?`Interests · ${sh.length} in common with you`:"Interests"}</p><div class="wrap">${sh.map(i=>`<span class="chip sm shared">${ICON.check}${esc(i)}</span>`).join("")}${rest.map(i=>`<span class="chip sm">${esc(i)}</span>`).join("")}</div></section>`;
}
function profileBody(p,opts){
  const out=[photoBlock(p,0,opts),factsBlock(p)];
  if(p.prompts[0])out.push(promptBlock(p,0,opts,true));
  if(p.photos[1])out.push(photoBlock(p,1,opts));
  if(p.intro)out.push(`<section class="pcard plain"><p class="q">About me</p><p class="a" style="font-size:20px;font-weight:600">${esc(p.intro)}</p></section>`);
  if(p.prompts[1])out.push(promptBlock(p,1,opts,false));
  out.push(interestsBlock(p));
  if(p.photos[2])out.push(photoBlock(p,2,opts));
  if(p.prompts[2])out.push(promptBlock(p,2,opts,true));
  if(p.photos[3])out.push(photoBlock(p,3,opts));
  return out.join("");
}

function queue(){
 const f=S.f,me=S.me;
 return S.people
  .filter(p=>!connWith(p.id)&&!S.skipped.includes(p.id))
  .filter(p=>!f.interests.length||p.interests.some(i=>f.interests.includes(i)))
  .filter(p=>!f.lang||p.langs.includes(f.lang))
  .filter(p=>!f.city||(me.city&&p.city.toLowerCase()===me.city.trim().toLowerCase()))
  .filter(p=>!f.level||me.level==null||p.level==null||Math.abs(p.level-me.level)<=1)
  .sort((a,b)=>shared(b).length-shared(a).length);
}
const activeFilters=()=>S.f.interests.length+(S.f.lang?1:0)+(S.f.city?1:0)+(S.f.level?1:0);

  <div class="prompt"><span class="lbl">Today's conversation starter</span><p class="q">${esc(daily)}</p></div>
  <div class="seg" role="group" aria-label="Category">${["All","Everyday","Work","Study"].map(c=>`<button data-a="tcat" data-v="${c}" ${pressed(t.cat===c)}>${c}</button>`).join("")}</div>
  <button class="tgl" data-a="tmine" ${pressed(t.mine)} style="align-self:flex-start"><span class="tr"></span>Suited to my level${me.level!=null?` (${LEVELS[me.level]})`:""}</button>
  <div class="tlist">${list.length?list.map(x=>`<button class="trow" data-a="topic" data-v="${x.id}"><span class="t"><b>${x.title}</b><span>${LEVELS[x.lv[0]]} to ${LEVELS[x.lv[1]]}</span></span><span class="tag">${x.cat}</span>${ICON.chev}</button>`).join(""):`<div class="empty"><p class="muted" style="margin:0">No topics in this category for your level yet.</p><button class="btn ghost sm" data-a="tall">Show all levels</button></div>`}</div>
 </div>`}

function vTopic(id){
 const x=TOPICS.find(t=>t.id===id);if(!x){S.route="tab:topics";return vTopics()+nav("topics")}
 return`${header("",{back:true})}
 <div class="scroll">
  <div class="stack" style="gap:6px"><span class="tag" style="align-self:flex-start">${x.cat}</span><h1 style="font:800 28px/1.15 var(--display);margin:0;letter-spacing:-.015em">${x.title}</h1><span class="muted">${LEVELS[x.lv[0]]} to ${LEVELS[x.lv[1]]}</span></div>
  <div class="stack"><span class="lbl">Questions to ask each other</span><ul class="qs">${x.qs.map(q=>`<li>${esc(q)}</li>`).join("")}</ul></div>
  <div class="stack"><span class="lbl">Useful phrases</span>${x.ph.map(([a,b])=>`<div class="phr"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join("")}</div>
  <button class="btn primary block" data-a="partner">Find a practice partner</button>
 </div>`}

function likedBlock(item){
 if(!item)return"";
 if(item.startsWith("photo:")){const src=photoSrc(item.slice(6));return`<div class="quote">${src?`<img src="${esc(src)}" alt="">`:""}<span><span class="q">Said hi to</span><span class="a">Your photo</span></span></div>`}
 if(item.startsWith("prompt:")){const [q,...a]=item.slice(7).split("\n");return`<div class="quote"><span style="min-width:0"><span class="q">${esc(q)}</span><span class="a">${esc(a.join(" "))}</span></span></div>`}
 return"";
}
function vFriends(){
 const t=S.ftab,inc=incoming(),fr=friendsList(),sent=sentList();
 let body="";
 if(t==="requests"){
  body=inc.length?inc.map(c=>{const p=person(c.from_id);return`<div class="req">
   <button class="head" data-a="open" data-v="${esc(p.id)}">${avatar(p,56)}<span style="flex:1;min-width:0"><b>${esc(p.name)} said hi</b><span>${esc(p.age)}${p.city?" · "+esc(p.city):""} · Tap to see profile</span></span>${ICON.chev}</button>
   ${likedBlock(c.liked_item)}
   ${c.message?`<div class="bubble">${esc(c.message)}</div>`:""}
   <div class="row" style="flex-wrap:nowrap"><button class="btn line" style="flex:1" data-a="decline" data-v="${c.id}">Decline</button><button class="btn primary" style="flex:1" data-a="accept" data-v="${c.id}">Accept</button></div>
  </div>`}).join(""):`<div class="empty"><h2>No new hellos yet</h2><p class="muted" style="margin:0">When someone says hi to you, it shows up here.</p><button class="btn ghost sm" data-a="tab" data-v="discover">Go to Discover</button></div>`;
 }else if(t==="friends"){
  body=fr.length?fr.map(id=>{const p=person(id);return`<div class="frow">${avatar(p,48)}<button class="who" data-a="open" data-v="${esc(p.id)}"><b>${esc(p.name)}</b><span>${esc(p.city||"")}${p.city?" · ":""}${LEVELS[p.level]||""}</span></button>${ICON.chev}</div>`}).join("")+`<p class="note">Messaging your friends is coming in the next update.</p>`
   :`<div class="empty"><h2>No friends yet</h2><p class="muted" style="margin:0">Say hi to people on Discover. When they accept, they'll appear here.</p></div>`;
 }else{
  body=sent.length?sent.map(c=>{const p=person(c.to_id);return`<div class="frow">${avatar(p,48)}<button class="who" data-a="open" data-v="${esc(p.id)}"><b>${esc(p.name)}</b><span>Waiting for a reply</span></button><button class="btn line sm" data-a="cancel" data-v="${c.id}">Cancel</button></div>`}).join("")
   :`<div class="empty"><p class="muted" style="margin:0">You haven't said hi to anyone yet.</p></div>`;
 }
 return`${header("Friends")}
 <div class="scroll">
  <div class="seg" role="group" aria-label="Show">${[["requests","Hellos",inc.length],["friends","Friends",fr.length],["sent","Sent",sent.length]].map(([k,l,n])=>`<button data-a="ftab" data-v="${k}" ${pressed(t===k)}>${l}${n?` (${n})`:""}</button>`).join("")}</div>
  ${body}
 </div>`}

function vMe(){
 const me=S.me;
 return`${header("Me")}
 <div class="scroll">
  <div class="me-hero">${avatar(me,128)}<p class="name">${esc(me.name)}</p><span class="muted">${[me.age,me.city].filter(Boolean).map(esc).join(" · ")}</span></div>
  <div class="row" style="flex-wrap:nowrap"><button class="btn primary" style="flex:1" data-a="edit">Edit profile</button><button class="btn line" style="flex:1" data-a="open" data-v="${esc(me.id)}">Preview</button></div>
  ${!me.photos.length?`<div class="msg ok">Profiles with photos get more hellos. Add one in Edit profile.</div>`:""}
  <div class="stack" style="gap:8px"><span class="lbl">Invite a friend</span>${inviteBox()}</div>
  <div class="stack" style="gap:8px"><span class="lbl">Account</span>
   <span class="count">Logged in as ${esc(S.user&&S.user.email)}</span>
   <button class="btn ghost block" data-a="signout">Log out</button>
   <button class="btn danger block" data-a="askdelete">Delete my profile</button></div>
 </div>`}

/* ---------- Actions ---------- */
const toggle=(arr,v)=>{const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1)};
function readDraft(){app.querySelectorAll("[data-f]").forEach(el=>{S.draft[el.dataset.f]=el.value})}
function readAuth(){app.querySelectorAll("[data-af]").forEach(el=>{S.auth[el.dataset.af]=el.value})}

async function submitAuth(){
 readAuth();const a=S.auth;a.msg=null;
 const email=a.email.trim(),pw=a.password;
 if(!/^\S+@\S+\.\S+$/.test(email)){a.msg={text:"Enter a valid email address."};render();return}
 if(pw.length<8){a.msg={text:"Use a password with at least 8 characters."};render();return}
 a.busy=true;render();
 try{
  if(a.mode==="signup"){
   const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:appUrl()}});
   if(error)throw error;
   a.password="";
   if(!data.session){S.stack=[];S.route="checkemail";render(true)}
  }else{
   const {error}=await sb.auth.signInWithPassword({email,password:pw});
   if(error)throw error;
   a.password="";
  }
 }catch(e){a.msg={text:friendlyAuthError(e)}}
 a.busy=false;if(S.route==="auth")render();
}
async function submitNewPass(){
 readAuth();const a=S.auth;a.msg=null;
 if(a.password.length<8){a.msg={text:"Use a password with at least 8 characters."};render();return}
 a.busy=true;render();
 const {error}=await sb.auth.updateUser({password:a.password});
 a.busy=false;a.password="";
 if(error){a.msg={text:friendlyAuthError(error)};render();return}
 toast("Password updated.");S.route="loading";render(true);
 const {data}=await sb.auth.getSession();S.me=null;S.user=null;onSession(data.session);
}

function openPromptAnswer(i,q,a){
 S.promptEdit={i,q};
 sheet(`<p class="lbl" style="margin:0">Your answer</p><h2>${esc(q)}</h2>
  <textarea class="inp" id="p-ans" maxlength="${ANSWER_MAX}" placeholder="Write a short answer…">${esc(a||"")}</textarea>
  <span class="count" id="p-count">${(a||"").length} / ${ANSWER_MAX}</span>
  <button class="btn primary block" data-a="saveprompt">Save answer</button>
  ${S.draft.prompts[i]?`<button class="btn danger block" data-a="rmprompt" data-v="${i}">Remove this prompt</button>`:""}
  <button class="btn ghost block" data-a="close">Cancel</button>`);
}

async function sendHi(pid,item){
 const ta=document.getElementById("hi-msg");const message=ta?ta.value.trim():"";
 const btn=app.querySelector('[data-a="dosendhi"]');if(btn){btn.disabled=true;btn.textContent="Sending…"}
 const {data,error}=await sb.from("connections").insert({from_id:myId(),to_id:pid,liked_item:item||null,message:message||null}).select().single();
 if(error){
  if(btn){btn.disabled=false;btn.textContent="Send hi"}
  if(error.code==="23505"){closeSheet();toast("You're already connected with this person. Check your Friends tab.");refresh();return}
  toast("Couldn't send: "+error.message);return;
 }
 S.conns.push(data);closeSheet();
 const p=person(pid);
 if(S.route.startsWith("person:"))render();else render(true);
 toast(`Hi sent to ${p?p.name:"them"}. You'll be friends if they accept.`);
}

const A={
 back,
 tab:v=>tab(v),
 reload:()=>location.reload(),
 scrim:(v,t,e)=>{if(e.target===t)closeSheet()},
 close:()=>closeSheet(),
 about:()=>sheet(`<h2>Friendly test version</h2>
  <p style="margin:0">This is an early version for a small group of testers.</p>
  <div class="stack" style="gap:6px"><span class="lbl">Works now</span><ul><li>Accounts and logging in</li><li>Profiles with photos and prompts</li><li>Discover, one person at a time</li><li>Saying hi, and accepting or declining hellos</li><li>English topics</li></ul></div>
  <div class="stack" style="gap:6px"><span class="lbl">Coming next</span><ul><li>Messaging your friends</li><li>Blocking and reporting</li></ul></div>
  <p class="note">Only invite people you know while Friendly is in testing.</p>
  <button class="btn primary block" data-a="close">Got it</button>`),
 toauth:v=>{S.auth.mode=v;S.auth.msg=null;if(S.route==="auth"){render()}else{S.stack=[];go("auth")}},
 forgot:async()=>{
  readAuth();const email=S.auth.email.trim();
  if(!/^\S+@\S+\.\S+$/.test(email)){S.auth.msg={text:"Type your email above first, then tap Forgot password."};render();return}
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:appUrl()});
  S.auth.msg=error?{text:friendlyAuthError(error)}:{ok:true,text:"If that email has an account, we've sent a link to reset your password."};render();
 },
 signout:async()=>{closeSheet();await sb.auth.signOut();},

 // setup step 1
 level:v=>{readDraft();S.draft.level=+v;delete errs.level;render()},
 lang:v=>{readDraft();toggle(S.draft.langs,v);delete errs.langs;render()},
 conn:v=>{readDraft();toggle(S.draft.connect,v);render()},
 next1:()=>{readDraft();const d=S.draft;errs={};
  if(!d.name.trim())errs.name="Add your first name.";
  const ag=parseInt(d.age,10);
  if(!String(d.age).trim()||isNaN(ag))errs.age="Add your age.";
  else if(ag<18)errs.age="Friendly is for adults 18 and over.";
  else if(ag>110)errs.age="Check your age.";
  if(d.level==null)errs.level="Choose the level that sounds most like you.";
  if(!d.langs.length)errs.langs="Pick at least one language.";
  if(Object.keys(errs).length){render();const e=app.querySelector(".err");e&&e.scrollIntoView({block:"center",behavior:"smooth"});return}
  go("setup2")},

 // setup step 2
 rmphoto:v=>{const d=S.draft,ph=d.photos[+v];if(ph&&ph.path)d.removed.push(ph.path);d.photos.splice(+v,1);render()},
 pickprompt:v=>{
  const used=S.draft.prompts.map(p=>p.q);
  sheet(`<h2>Choose a prompt</h2><div class="plist">${PROMPTS.filter(q=>!used.includes(q)).map(q=>`<button data-a="choosep" data-v="${esc(q)}">${esc(q)}</button>`).join("")}</div><button class="btn ghost block" data-a="close">Cancel</button>`);
  S.promptEdit={i:+v};
 },
 choosep:v=>{const i=S.promptEdit?S.promptEdit.i:S.draft.prompts.length;openPromptAnswer(Math.min(i,S.draft.prompts.length),v,"")},
 editprompt:v=>{const pr=S.draft.prompts[+v];if(pr)openPromptAnswer(+v,pr.q,pr.a)},
 saveprompt:()=>{
  const a=(document.getElementById("p-ans")||{}).value||"";
  if(!a.trim()){toast("Write an answer first.");return}
  const {i,q}=S.promptEdit;const d=S.draft;
  if(d.prompts[i])d.prompts[i]={q,a:a.trim()};else d.prompts.push({q,a:a.trim()});
  delete errs.prompts;closeSheet();render();
 },
 rmprompt:v=>{S.draft.prompts.splice(+v,1);closeSheet();render()},
 next2:()=>{if(!S.draft.prompts.length){errs.prompts="Answer at least one prompt.";render();return}errs={};go("setup3")},

 // setup step 3
 int:v=>{toggle(S.draft.interests,v);render()},
 finish:async()=>{
  const d=S.draft;if(d.interests.length<3||S.busy)return;
  S.busy=true;render();
  const uid=myId(),uploaded=[],paths=[];
  for(let k=0;k<d.photos.length;k++){
   const ph=d.photos[k];
   if(ph.blob){
    const p=uid+"/"+Date.now()+"-"+k+".jpg";
    const {error:upErr}=await sb.storage.from("avatars").upload(p,ph.blob,{contentType:"image/jpeg",upsert:false});
    if(upErr){if(uploaded.length)sb.storage.from("avatars").remove(uploaded);S.busy=false;render();toast("Couldn't upload a photo: "+upErr.message);return}
    uploaded.push(p);paths.push(p);S.photoUrls[p]=ph.preview;
   }else if(ph.path)paths.push(ph.path);
  }
  const {data,error}=await sb.from("profiles").upsert(toRow(d,uid,paths)).select().single();
  S.busy=false;
  if(error){if(uploaded.length)sb.storage.from("avatars").remove(uploaded);render();toast("Couldn't save your profile: "+error.message);return}
  const stale=d.removed.filter(p=>!paths.includes(p));if(stale.length)sb.storage.from("avatars").remove(stale);
  const was=S.editing;S.me=fromRow(data);S.editing=false;S.draft=blankDraft();S.stack=[];S.route=was?"tab:me":"tab:discover";render(true);
  toast(was?"Profile updated.":"Profile saved. Welcome to Friendly!");
  if(!was)loadAll();
 },
 edit:()=>{const m=S.me;S.draft={name:m.name,age:String(m.age),city:m.city,langs:[...m.langs],level:m.level,intro:m.intro,connect:[...m.connect],interests:[...m.interests],photos:m.photos.map(p=>({path:p})),prompts:m.prompts.map(p=>({...p})),removed:[]};S.editing=true;errs={};go("setup1")},

 // discover
 filters:()=>{
  const f=S.f,me=S.me,langs=[...new Set(S.people.flatMap(p=>p.langs))].sort();
  sheet(`<h2>Filters</h2>
   <span class="lbl">Interests</span>
   <div class="wrap">${INTERESTS.map(i=>`<button class="chip" data-a="fint" data-v="${i}" ${pressed(f.interests.includes(i))}>${f.interests.includes(i)?ICON.check:""}${i}</button>`).join("")}</div>
   <span class="lbl">Speaks</span>
   <select class="inp" id="f-lang" aria-label="Language" style="align-self:flex-start"><option value="">Any language</option>${langs.map(l=>`<option ${f.lang===l?"selected":""}>${esc(l)}</option>`).join("")}</select>
   <div class="row"><button class="tgl" data-a="fcity" ${pressed(f.city)}><span class="tr"></span>In ${esc(me.city||"my city")}</button>
   <button class="tgl" data-a="flevel" ${pressed(f.level)}><span class="tr"></span>Similar English level</button></div>
   <button class="btn primary block" data-a="fdone">Show people</button>
   <button class="btn link" data-a="fclear" style="align-self:center">Clear all</button>`);
 },
 fint:(v,t)=>{toggle(S.f.interests,v);const on=S.f.interests.includes(v);t.setAttribute("aria-pressed",on);t.innerHTML=(on?ICON.check:"")+esc(v)},
 fcity:(v,t)=>{S.f.city=!S.f.city;t.setAttribute("aria-pressed",S.f.city)},
 flevel:(v,t)=>{S.f.level=!S.f.level;t.setAttribute("aria-pressed",S.f.level)},
 fdone:()=>{closeSheet();render(true)},
 fclear:()=>{S.f={interests:[],lang:"",city:false,level:false};closeSheet();render(true)},
 skip:v=>{if(!S.skipped.includes(v))S.skipped.push(v);saveSkipped();render(true)},
 unskip:()=>{S.skipped=[];saveSkipped();render(true)},
 sayhi:v=>{
  const [pid,kind,idx]=String(v).split("|");const p=person(pid);if(!p)return;
  let item=null,preview="";
  if(kind==="photo"){item="photo:"+p.photos[+idx];const src=photoSrc(p.photos[+idx]);preview=src?`<div class="quote"><img src="${esc(src)}" alt=""><span><span class="q">You're saying hi to</span><span class="a">${esc(p.name)}'s photo</span></span></div>`:""}
  else if(kind==="prompt"){const pr=p.prompts[+idx];item="prompt:"+pr.q+"\n"+pr.a;preview=`<div class="quote"><span style="min-width:0"><span class="q">${esc(pr.q)}</span><span class="a">${esc(pr.a)}</span></span></div>`}
  S.hiTarget={pid,item};
  sheet(`<h2>Say hi to ${esc(p.name)}</h2>${preview}
   <label class="lbl" for="hi-msg">Add a message (optional)</label>
   <textarea class="inp" id="hi-msg" maxlength="200" placeholder="${kind==="prompt"?"Tell them what you liked about their answer…":"Introduce yourself in a sentence…"}"></textarea>
   <button class="btn primary block" data-a="dosendhi">Send hi</button>
   <button class="btn ghost block" data-a="close">Cancel</button>`);
 },
 dosendhi:()=>{if(S.hiTarget)sendHi(S.hiTarget.pid,S.hiTarget.item)},
 open:v=>go("person:"+v),

 // friends
 ftab:v=>{S.ftab=v;render()},
 accept:async v=>{
  const {error}=await sb.from("connections").update({status:"accepted",responded_at:new Date().toISOString()}).eq("id",v);
  if(error){toast("Couldn't accept: "+error.message);return}
  const c=S.conns.find(c=>c.id===v);if(c)c.status="accepted";render();
  const p=c&&person(c.from_id);toast(p?`You and ${p.name} are now friends.`:"Accepted.");
 },
 decline:async v=>{
  const {error}=await sb.from("connections").update({status:"declined",responded_at:new Date().toISOString()}).eq("id",v);
  if(error){toast("Couldn't decline: "+error.message);return}
  const c=S.conns.find(c=>c.id===v);if(c)c.status="declined";render();toast("Declined. They won't be told.");
 },
 cancel:async v=>{
  const {error}=await sb.from("connections").delete().eq("id",v);
  if(error){toast("Couldn't cancel: "+error.message);return}
  S.conns=S.conns.filter(c=>c.id!==v);render();toast("Hi cancelled.");
 },

 // topics
 topic:v=>go("topic:"+v),
 tcat:v=>{S.tf.cat=v;render()},
 tmine:()=>{S.tf.mine=!S.tf.mine;render()},
 tall:()=>{S.tf.mine=false;render()},
 partner:()=>{S.f={interests:[],lang:"",city:false,level:true};tab("discover");toast("Showing people at a similar English level.")},

 // me
 copylink:async()=>{const inp=document.getElementById("invite-url");try{await navigator.clipboard.writeText(appUrl());toast("Link copied.")}catch(e){if(inp){inp.focus();inp.select()}toast("Press and hold the link to copy it.")}},
 askdelete:()=>sheet(`<h2>Delete your profile?</h2><p style="margin:0">Your profile, photos and hellos will be removed and no one will see them. You'll be logged out. You can make a new profile later by logging in again.</p><button class="btn danger block" data-a="dodelete">Delete profile</button><button class="btn ghost block" data-a="close">Cancel</button>`),
 dodelete:async()=>{
  closeSheet();
  const uid=myId();
  const {data:files}=await sb.storage.from("avatars").list(uid);
  if(files&&files.length)await sb.storage.from("avatars").remove(files.map(f=>uid+"/"+f.name));
  const {error}=await sb.from("profiles").delete().eq("id",uid);
  if(error){toast("Couldn't delete: "+error.message);return}
  S.me=null;await sb.auth.signOut();toast("Your profile was deleted.");
 }
};

app.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||t.disabled)return;const fn=A[t.dataset.a];if(fn){e.preventDefault();fn(t.dataset.v,t,e)}});
app.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="authform")submitAuth();if(e.target.id==="passform")submitNewPass()});
app.addEventListener("change",e=>{if(e.target.id==="f-lang"){S.f.lang=e.target.value}});
app.addEventListener("input",e=>{
 const f=e.target.dataset&&e.target.dataset.f;if(f){S.draft[f]=e.target.value}
 const af=e.target.dataset&&e.target.dataset.af;if(af){S.auth[af]=e.target.value}
 if(e.target.id==="p-ans"){const c=document.getElementById("p-count");if(c)c.textContent=e.target.value.length+" / "+ANSWER_MAX}
});
fileInput.addEventListener("change",()=>{
 const f=fileInput.files&&fileInput.files[0];fileInput.value="";
 if(!f)return;
 if(S.draft.photos.length>=MAX_PHOTOS){toast("You can add up to 4 photos.");return}
 if(f.type&&!/^image\//.test(f.type)){toast("Choose a photo file.");return}
 resizeImage(f).then(r=>{S.draft.photos.push({blob:r.blob,preview:r.preview});render()}).catch(err=>toast(err.message));
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refresh()});

/* ---------- Start ---------- */
sb.auth.onAuthStateChange((event,session)=>{
 // Run outside the callback so Supabase calls inside onSession don't block it.
 setTimeout(()=>{
  if(event==="PASSWORD_RECOVERY"){S.user=session&&session.user;S.auth.msg=null;S.auth.password="";S.route="newpass";render(true);return}
  if(S.route==="newpass")return;
  if(event==="SIGNED_IN"||event==="SIGNED_OUT"||event==="INITIAL_SESSION")onSession(session);
 },0);
});
})();
</script>
</body>
</html>
