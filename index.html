<style>
/* Layout: one phone-width app column, scrolling content between a slim header and a bottom tab bar */
:root{
  --bg:#F3F7F5; --surface:#FFFFFF; --surface-2:#E7EFEC; --ink:#14302A; --muted:#5A6E69; --line:#D5E1DD;
  --accent:#2C7866; --accent-ink:#FFFFFF; --accent-soft:#D8EDE6;
  --sun:#F4C04E; --sun-soft:#FCEFCF; --sun-ink:#5A4410; --on-sun:#2E2304;
  --rose:#B9483A; --scrim:rgba(8,20,17,.45);
  --av1:#CFE6F5; --av2:#F7DCCB; --av3:#DCEFD3; --av4:#E7DDF4; --av5:#FBE7B3; --av-ink:#1D2E2A;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1916; --surface:#15231F; --surface-2:#1D2F2A; --ink:#E4EFEB; --muted:#9BB0AA; --line:#2A3E38;
  --accent:#62C3AA; --accent-ink:#06211B; --accent-soft:#1C3D35;
  --sun:#F4C04E; --sun-soft:#3A3014; --sun-ink:#F8E2A6; --on-sun:#2E2304;
  --rose:#F08B79; --scrim:rgba(0,0,0,.6);
  --av1:#2D4A5E; --av2:#5A3E30; --av3:#34503A; --av4:#45395A; --av5:#5A4A20; --av-ink:#EEF4F2;
  color-scheme:dark}}

html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media (min-width:520px){.app{border-inline:1px solid var(--line)}}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;min-height:58px}
.top h1{font:700 24px/1.15 var(--display);margin:0;flex:1;min-width:0;letter-spacing:-.01em}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface-2);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.pill{border:0;font:700 10.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border-radius:999px;background:var(--sun-soft);color:var(--sun-ink);flex:none}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 28px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:18px}

.nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 4px}
.nav button{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px 0;color:var(--muted);font:600 11.5px var(--body)}
.nav svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent)}

h2{font:700 18px/1.2 var(--display);margin:0;letter-spacing:-.005em;text-wrap:balance}
.lbl{font:700 11.5px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.hscroll{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:none}

.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px/1.2 var(--body)}
.chip svg{width:14px;height:14px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.chip.sm{padding:4px 10px;font-size:13px;border-color:transparent;background:var(--surface-2)}
.chip.sm.shared{background:var(--accent-soft);font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:0;font:600 16px var(--body);text-decoration:none}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.sun{background:var(--sun);color:var(--on-sun)}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--rose);border:1px solid var(--line)}
.btn.link{background:none;min-height:40px;padding:0 4px;color:var(--accent);font-size:15px}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}

.av{--s:48px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;font:700 calc(var(--s)*.42)/1 var(--display);color:var(--av-ink);flex:none}
.av1{background:var(--av1)}.av2{background:var(--av2)}.av3{background:var(--av3)}.av4{background:var(--av4)}.av5{background:var(--av5)}

.meter{display:inline-flex;gap:3px;align-items:flex-end;height:14px}
.meter i{width:5px;border-radius:2px;background:var(--line)}
.meter i:nth-child(1){height:5px}.meter i:nth-child(2){height:7px}.meter i:nth-child(3){height:9px}.meter i:nth-child(4){height:11px}.meter i:nth-child(5){height:14px}
.meter i.on{background:var(--accent)}
.lvl{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600}

.welcome{flex:1;overflow-y:auto;padding:28px 16px 24px;display:flex;flex-direction:column;gap:26px}
.mark{display:flex;align-items:center;gap:12px}
.mark svg{width:52px;height:52px}
.word{font:800 46px/1 var(--display);letter-spacing:-.03em;margin:0}
.tagline{font:600 22px/1.3 var(--display);margin:0;max-width:16ch;text-wrap:balance}
.hellos{display:flex;flex-wrap:wrap;gap:8px}
.hello{padding:9px 14px;border-radius:18px 18px 18px 4px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.hello:nth-child(3n+2){background:var(--accent-soft);border-color:transparent}
.hello:nth-child(4n+3){background:var(--sun-soft);border-color:transparent;color:var(--sun-ink)}
.note{font-size:13px;color:var(--muted);margin:0}

.field{display:flex;flex-direction:column;gap:8px}
.inp{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0 14px;font:16px var(--body)}
textarea.inp{padding:12px 14px;min-height:96px;resize:vertical;line-height:1.45}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1.6fr;gap:12px}
.err{color:var(--rose);font-size:13px;font-weight:600}
.msg{padding:12px 14px;border-radius:14px;font-size:14px}
.msg.bad{background:var(--surface);border:1px solid var(--rose);color:var(--ink)}
.msg.ok{background:var(--accent-soft);color:var(--ink)}
.progress{display:flex;gap:6px}
.progress i{height:5px;flex:1;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--accent)}
.lvl-list{display:flex;flex-direction:column;gap:8px}
.lvl-opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.lvl-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lvl-opt b{display:block;font-size:15px}
.lvl-opt span.d{display:block;font-size:13px;color:var(--muted)}
.footer-bar{padding:12px 16px 14px;border-top:1px solid var(--line);background:var(--bg);display:flex;gap:10px}
.footer-bar .btn{flex:1}

.hi{font:700 26px/1.15 var(--display);margin:0;letter-spacing:-.01em}
.prompt{background:var(--sun-soft);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;color:var(--sun-ink)}
.prompt .q{font:700 19px/1.3 var(--display);color:var(--ink);margin:0;text-wrap:balance}
.tgl{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px}
.tgl .tr{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .15s}
.tgl .tr::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s}
.tgl[aria-pressed="true"] .tr{background:var(--accent)}
.tgl[aria-pressed="true"] .tr::after{transform:translateX(12px)}
select.inp{min-height:36px;width:auto;border-radius:999px;font-size:14px;padding:0 12px}

/* ---------- State ---------- */
function blankDraft(){return{name:"",age:"",city:"",langs:["English"],level:null,intro:"",connect:[],interests:[]}}
const S={user:null,me:null,people:[],peopleLoaded:false,route:"loading",stack:[],draft:blankDraft(),editing:false,

/* ---------- Auth & data ---------- */
async function onSession(session){
  const uid=session&&session.user?session.user.id:null;
  if(!uid){S.user=null;S.me=null;S.people=[];S.peopleLoaded=false;S.stack=[];if(S.route!=="checkemail")S.route="welcome";render(true);return}
  if(S.user&&S.user.id===uid&&S.me)return;
  S.user=session.user;S.route="loading";render(true);
  const {data,error}=await sb.from("profiles").select("*").eq("id",uid).maybeSingle();
  if(error){showError("We couldn't load your profile. "+error.message);return}
  S.stack=[];
  if(!data){S.me=null;S.draft=blankDraft();S.editing=false;errs={};S.route="setup1";render(true);return}
  S.me=fromRow(data);S.route="tab:discover";render(true);loadPeople();
}
async function loadPeople(){
  if(!S.user)return;
  const {data,error}=await sb.from("profiles").select("*").neq("id",S.user.id).order("created_at",{ascending:false}).limit(200);
  if(error){toast("Couldn't load people. Pull down or reopen the app to try again.");return}
  S.people=(data||[]).map(fromRow);S.peopleLoaded=true;
  if(S.route.startsWith("tab:discover")||S.route.startsWith("person:"))render();
}
function showError(t){S.errText=t;S.route="error";render(true)}
function friendlyAuthError(e){
  const m=(e&&e.message||"").toLowerCase();
  if(m.includes("invalid login"))return"That email and password don't match. Check them and try again.";
  if(m.includes("email not confirmed"))return"Please confirm your email first. Open the email from Friendly and tap the link.";
  if(m.includes("rate limit")||m.includes("too many"))return"Too many attempts. Wait a few minutes and try again.";
  if(m.includes("password")&&m.includes("least"))return"Use a password with at least 8 characters.";
  if(m.includes("valid email")||m.includes("invalid email"))return"Enter a valid email address.";
  return(e&&e.message)||"Something went wrong. Try again.";
}

/* ---------- Render ---------- */
function render(top){
  const prev=app.querySelector(".scroll,.welcome");const y=prev&&!top?prev.scrollTop:0;
  const keepToast=app.querySelector(".toast");
  let [kind,arg]=S.route.split(":");
  const open=["loading","error","welcome","auth","checkemail","newpass"];
  if(!S.user&&!open.includes(kind)){S.route="welcome";kind="welcome"}
  if(S.user&&!S.me&&!["setup1","setup2","loading","error","newpass"].includes(kind)){S.route="setup1";kind="setup1"}
  let html="";
  if(kind==="loading")html=`<div class="center"><div class="spinner" role="status" aria-label="Loading"></div></div>`;
  else if(kind==="error")html=`<div class="center"><h2>Something went wrong</h2><p class="muted" style="margin:0">${esc(S.errText)}</p><button class="btn primary" data-a="reload">Try again</button></div>`;
  else if(kind==="welcome")html=vWelcome();
  else if(kind==="auth")html=vAuth();
  else if(kind==="checkemail")html=vCheckEmail();
  else if(kind==="newpass")html=vNewPass();
  else if(kind==="setup1")html=vSetup1();
  else if(kind==="setup2")html=vSetup2();
  else if(kind==="person")html=vPerson(arg);
  else if(kind==="topic")html=vTopic(arg);
  else if(kind==="tab"){html=({discover:vDiscover,topics:vTopics,friends:vFriends,me:vMe}[arg]||vDiscover)();html+=nav(arg)}
  app.innerHTML=html;
  if(keepToast)app.appendChild(keepToast);
  const sc=app.querySelector(".scroll,.welcome");if(sc){sc.scrollTop=y;if(top)sc.classList.add("screen-fade")}
}

  <div class="two">
   <div class="field"><label class="lbl" for="f-name">First name</label><input class="inp" id="f-name" data-f="name" value="${esc(d.name)}" autocomplete="given-name" maxlength="30"></div>
   <div class="field"><label class="lbl" for="f-city">City</label><input class="inp" id="f-city" data-f="city" value="${esc(d.city)}" placeholder="e.g. Perth" maxlength="40"></div>
  </div>
  ${errs.name?`<span class="err">${errs.name}</span>`:""}
  <div class="field" style="max-width:140px"><label class="lbl" for="f-age">Age (18+)</label><input class="inp" id="f-age" data-f="age" value="${esc(d.age)}" inputmode="numeric" maxlength="3"></div>
  ${errs.age?`<span class="err">${errs.age}</span>`:""}
  <div class="field"><span class="lbl">Your English level</span>
   <div class="lvl-list">${LEVELS.map((l,i)=>`<button class="lvl-opt" data-a="level" data-v="${i}" ${pressed(d.level===i)}>${meter(i).replace(LEVELS[i],"")}<span><b>${l}</b><span class="d">${LEVEL_DESC[i]}</span></span></button>`).join("")}</div>
   ${errs.level?`<span class="err">${errs.level}</span>`:""}</div>
  <div class="field"><span class="lbl">Languages you speak</span>
   <div class="wrap">${LANGS.map(l=>`<button class="chip" data-a="lang" data-v="${l}" ${pressed(d.langs.includes(l))}>${d.langs.includes(l)?ICON.check:""}${l}</button>`).join("")}</div>
   ${errs.langs?`<span class="err">${errs.langs}</span>`:""}</div>
  <div class="field"><label class="lbl" for="f-intro">A short intro</label><textarea class="inp" id="f-intro" data-f="intro" maxlength="200" placeholder="What do you study or do? What kind of friends are you hoping to meet?">${esc(d.intro)}</textarea></div>
  <div class="field"><span class="lbl">How you like to connect</span>
   <div class="wrap">${CONNECT.map(c=>`<button class="chip" data-a="conn" data-v="${c}" ${pressed(d.connect.includes(c))}>${d.connect.includes(c)?ICON.check:""}${c}</button>`).join("")}</div></div>
  <p class="note">Other members can see everything on your profile except your email.</p>
 </div>
 <div class="footer-bar"><button class="btn primary" data-a="next1">Next: interests</button></div>`}

function vSetup2(){
 const d=S.draft,n=d.interests.length;
 return`${header("Your interests",{back:true})}
 <div class="scroll">
  <div class="stack"><div class="progress"><i class="on"></i><i class="on"></i></div><span class="count">Step 2 of 2</span></div>
  <p style="margin:0;font-size:16px">Pick at least three. We'll use them to show you people with things in common.</p>
  <div class="wrap">${INTERESTS.map(i=>`<button class="chip" data-a="int" data-v="${i}" ${pressed(d.interests.includes(i))}>${d.interests.includes(i)?ICON.check:""}${i}</button>`).join("")}</div>
  <span class="count" aria-live="polite">${n} selected${n<3?` · ${3-n} more to go`:""}</span>
 </div>
 <div class="footer-bar"><button class="btn primary" data-a="finish" ${n<3||S.busy?"disabled":""}>${S.busy?"Saving…":S.editing?"Save changes":"Start meeting people"}</button></div>`}

function filtered(){
 const f=S.f,me=S.me;
 return S.people
  .filter(p=>!f.interests.length||p.interests.some(i=>f.interests.includes(i)))
  .filter(p=>!f.lang||p.langs.includes(f.lang))
  .filter(p=>!f.city||(me.city&&p.city.toLowerCase()===me.city.trim().toLowerCase()))
  .filter(p=>!f.level||me.level==null||p.level==null||Math.abs(p.level-me.level)<=1)
  .sort((a,b)=>shared(b).length-shared(a).length);
}
function inviteBox(){return`<div class="copybox"><input class="inp" id="invite-url" readonly value="${esc(appUrl())}" aria-label="Friendly link"><button class="btn primary sm" data-a="copylink">Copy</button></div>`}

function vDiscover(){
 const me=S.me,f=S.f,list=filtered();
 const langs=[...new Set(S.people.flatMap(p=>p.langs))].sort();
 const daily=DAILY[Math.floor(Date.now()/864e5)%DAILY.length];
 let body;
 if(!S.peopleLoaded)body=`<div class="center" style="padding:32px 0"><div class="spinner" role="status" aria-label="Loading people"></div></div>`;
 else if(!S.people.length)body=`<div class="empty"><h2>You're one of the first here</h2><p class="muted" style="margin:0">No one else has joined yet. Send this link to a friend you trust so you can test Friendly together.</p>${inviteBox()}</div>`;
 else if(!list.length)body=`<div class="empty"><h2>No one matches all of these</h2><p class="muted" style="margin:0">Try removing a filter.</p><button class="btn ghost sm" data-a="fclear">Clear filters</button></div>`;
 else body=list.map(p=>{const sh=shared(p),rest=p.interests.filter(i=>!sh.includes(i));return`
  <article class="pcard">
   <button class="head" data-a="open" data-v="${esc(p.id)}">${avatar(p,52)}
    <span class="who"><span class="name">${esc(p.name)}, ${esc(p.age)}</span><br><span class="meta">${p.city?esc(p.city)+" · ":""}Speaks ${esc(p.langs.join(", "))}</span></span>${ICON.chev}</button>
   <div class="row" style="justify-content:space-between">${meter(p.level)}${sh.length?`<span class="count">${sh.length} shared interest${sh.length>1?"s":""}</span>`:""}</div>
   <div class="wrap">${sh.map(i=>`<span class="chip sm shared">${esc(i)}</span>`).join("")}${rest.map(i=>`<span class="chip sm">${esc(i)}</span>`).join("")}</div>
   <button class="btn line sm" data-a="open" data-v="${esc(p.id)}">View profile</button>
  </article>`}).join("");
 return`${header("Discover")}
 <div class="scroll">
  <p class="hi">Hi ${esc(me.name)}, here's who you might click with.</p>
  <div class="prompt"><span class="lbl" style="color:var(--sun-ink)">Today's conversation starter</span><p class="q">${esc(daily)}</p></div>
  ${S.people.length?`<div class="stack">
   <span class="lbl">Interests</span>
   <div class="hscroll">${INTERESTS.map(i=>`<button class="chip" data-a="fint" data-v="${i}" ${pressed(f.interests.includes(i))}>${f.interests.includes(i)?ICON.check:""}${i}</button>`).join("")}</div>
   <div class="row">
    <select class="inp" id="f-lang" aria-label="Language"><option value="">Any language</option>${langs.map(l=>`<option ${f.lang===l?"selected":""}>${esc(l)}</option>`).join("")}</select>
    <button class="tgl" data-a="fcity" ${pressed(f.city)}><span class="tr"></span>In ${esc(me.city||"my city")}</button>
    <button class="tgl" data-a="flevel" ${pressed(f.level)}><span class="tr"></span>Similar level</button>
   </div>
  </div>
  <span class="count">${list.length} ${list.length===1?"person":"people"}</span>`:""}
  ${body}
 </div>`}

function vPerson(id){
 const p=person(id);if(!p){S.route="tab:discover";return vDiscover()+nav("discover")}
 const sh=shared(p),rest=p.interests.filter(i=>!sh.includes(i));
 return`${header("",{back:true})}
 <div class="scroll">
  <div class="hero">${avatar(p,96)}<p class="name">${esc(p.name)}</p><span class="muted">${esc(p.age)}${p.city?" · "+esc(p.city):""}</span></div>
  <button class="btn primary block" disabled>Add friend (coming next update)</button>
  <div class="facts"><div><span class="lbl">English</span>${p.level!=null?meter(p.level):"<b>Not set</b>"}</div><div><span class="lbl">Speaks</span><b>${esc(p.langs.join(", ")||"Not set")}</b></div></div>
  ${p.intro?`<div class="stack"><span class="lbl">About</span><p class="intro">${esc(p.intro)}</p></div>`:""}
  <div class="stack"><span class="lbl">${sh.length?`Interests · ${sh.length} in common`:"Interests"}</span><div class="wrap">${sh.map(i=>`<span class="chip sm shared">${ICON.check}${esc(i)}</span>`).join("")}${rest.map(i=>`<span class="chip sm">${esc(i)}</span>`).join("")}</div></div>
  ${p.connect.length?`<div class="stack"><span class="lbl">Likes to connect by</span><div class="wrap">${p.connect.map(c=>`<span class="chip sm">${esc(c)}</span>`).join("")}</div></div>`:""}
 </div>`}

function vTopics(){
 const me=S.me,t=S.tf;
 const list=TOPICS.filter(x=>(t.cat==="All"||x.cat===t.cat)&&(!t.mine||me.level==null||(me.level>=x.lv[0]&&me.level<=x.lv[1])));
 return`${header("Topics")}
 <div class="scroll">
  <p style="margin:0;font-size:16px">Conversation starters and useful phrases. Pick one, then find someone to practise with.</p>
  <div class="seg" role="group" aria-label="Category">${["All","Everyday","Work","Study"].map(c=>`<button data-a="tcat" data-v="${c}" ${pressed(t.cat===c)}>${c}</button>`).join("")}</div>
  <button class="tgl" data-a="tmine" ${pressed(t.mine)} style="align-self:flex-start"><span class="tr"></span>Suited to my level${me.level!=null?` (${LEVELS[me.level]})`:""}</button>
  <div class="tlist">${list.length?list.map(x=>`<button class="trow" data-a="topic" data-v="${x.id}"><span class="t"><b>${x.title}</b><span>${LEVELS[x.lv[0]]} to ${LEVELS[x.lv[1]]}</span></span><span class="tag">${x.cat}</span>${ICON.chev}</button>`).join(""):`<div class="empty"><p class="muted" style="margin:0">No topics in this category for your level yet.</p><button class="btn ghost sm" data-a="tall">Show all levels</button></div>`}</div>
 </div>`}

function vTopic(id){
 const x=TOPICS.find(t=>t.id===id);if(!x){S.route="tab:topics";return vTopics()+nav("topics")}
 return`${header("",{back:true})}
 <div class="scroll">
  <div class="stack" style="gap:6px"><span class="tag" style="align-self:flex-start">${x.cat}</span><h1 style="font:800 28px/1.15 var(--display);margin:0;letter-spacing:-.015em">${x.title}</h1><span class="muted">${LEVELS[x.lv[0]]} to ${LEVELS[x.lv[1]]}</span></div>
  <div class="stack"><span class="lbl">Questions to ask each other</span><ul class="qs">${x.qs.map(q=>`<li>${esc(q)}</li>`).join("")}</ul></div>
  <div class="stack"><span class="lbl">Useful phrases</span>${x.ph.map(([a,b])=>`<div class="phr"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join("")}</div>
  <button class="btn sun block" data-a="partner">Find a practice partner</button>
 </div>`}

function vFriends(){
 return`${header("Friends")}
 <div class="scroll">
  <div class="empty"><h2>Friend requests are coming next</h2><p class="muted" style="margin:0">In the next update you'll be able to send, accept and decline friend requests here. For now, browse people on Discover.</p><button class="btn ghost sm" data-a="tab" data-v="discover">Go to Discover</button></div>
 </div>`}

function vMe(){
 const me=S.me;
 return`${header("Me")}
 <div class="scroll">
  <div class="hero">${avatar(me,96)}<p class="name">${esc(me.name)}</p><span class="muted">${[me.age,me.city].filter(Boolean).map(esc).join(" · ")}</span></div>
  <button class="btn line block" data-a="edit">Edit profile</button>
  <div class="facts"><div><span class="lbl">English</span>${me.level!=null?meter(me.level):"<b>Not set</b>"}</div><div><span class="lbl">Speaks</span><b>${esc(me.langs.join(", ")||"Not set")}</b></div></div>
  ${me.intro?`<div class="stack"><span class="lbl">About</span><p class="intro">${esc(me.intro)}</p></div>`:""}
  <div class="stack"><span class="lbl">Interests</span><div class="wrap">${me.interests.map(i=>`<span class="chip sm">${esc(i)}</span>`).join("")}</div></div>
  ${me.connect.length?`<div class="stack"><span class="lbl">Likes to connect by</span><div class="wrap">${me.connect.map(c=>`<span class="chip sm">${esc(c)}</span>`).join("")}</div></div>`:""}
  <div class="stack" style="gap:8px"><span class="lbl">Invite a friend</span>${inviteBox()}</div>
  <div class="stack" style="gap:8px"><span class="lbl">Account</span>
   <span class="count">Logged in as ${esc(S.user&&S.user.email)}</span>
   <button class="btn ghost block" data-a="signout">Log out</button>
   <button class="btn danger block" data-a="askdelete">Delete my profile</button></div>
 </div>`}

/* ---------- Actions ---------- */
const toggle=(arr,v)=>{const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1)};
function readDraft(){app.querySelectorAll("[data-f]").forEach(el=>{S.draft[el.dataset.f]=el.value})}
function readAuth(){app.querySelectorAll("[data-af]").forEach(el=>{S.auth[el.dataset.af]=el.value})}

async function submitAuth(){
 readAuth();const a=S.auth;a.msg=null;
 const email=a.email.trim(),pw=a.password;
 if(!/^\S+@\S+\.\S+$/.test(email)){a.msg={text:"Enter a valid email address."};render();return}
 if(pw.length<8){a.msg={text:"Use a password with at least 8 characters."};render();return}
 a.busy=true;render();
 try{
  if(a.mode==="signup"){
   const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:appUrl()}});
   if(error)throw error;
   a.password="";
   if(!data.session){S.stack=[];S.route="checkemail";render(true)}
  }else{
   const {error}=await sb.auth.signInWithPassword({email,password:pw});
   if(error)throw error;
   a.password="";
  }
 }catch(e){a.msg={text:friendlyAuthError(e)}}
 a.busy=false;if(S.route==="auth")render();
}
async function submitNewPass(){
 readAuth();const a=S.auth;a.msg=null;
 if(a.password.length<8){a.msg={text:"Use a password with at least 8 characters."};render();return}
 a.busy=true;render();
 const {error}=await sb.auth.updateUser({password:a.password});
 a.busy=false;a.password="";
 if(error){a.msg={text:friendlyAuthError(error)};render();return}
 toast("Password updated.");S.route="loading";render(true);
 const {data}=await sb.auth.getSession();S.me=null;S.user=null;onSession(data.session);
}

const A={
 back,
 tab:v=>tab(v),
 reload:()=>location.reload(),
 scrim:(v,t,e)=>{if(e.target===t)closeSheet()},
 close:()=>closeSheet(),
 about:()=>sheet(`<h2>Friendly test version</h2>
  <p style="margin:0">This is an early version for a small group of testers.</p>
  <div class="stack" style="gap:6px"><span class="lbl">Works now</span><ul><li>Creating an account and logging in</li><li>Your profile, saved securely online</li><li>Browsing other members' profiles</li><li>English topics</li></ul></div>
  <div class="stack" style="gap:6px"><span class="lbl">Coming next</span><ul><li>Friend requests</li><li>Messaging</li><li>Profile photos</li><li>Blocking and reporting</li></ul></div>
  <p class="note">Only invite people you know while Friendly is in testing.</p>
  <button class="btn primary block" data-a="close">Got it</button>`),
 toauth:v=>{S.auth.mode=v;S.auth.msg=null;if(S.route==="auth"){render()}else{S.stack=[];go("auth")}},
 forgot:async()=>{
  readAuth();const email=S.auth.email.trim();
  if(!/^\S+@\S+\.\S+$/.test(email)){S.auth.msg={text:"Type your email above first, then tap Forgot password."};render();return}
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:appUrl()});
  S.auth.msg=error?{text:friendlyAuthError(error)}:{ok:true,text:"If that email has an account, we've sent a link to reset your password."};render();
 },
 signout:async()=>{closeSheet();await sb.auth.signOut();},
 level:v=>{readDraft();S.draft.level=+v;delete errs.level;render()},
 lang:v=>{readDraft();toggle(S.draft.langs,v);delete errs.langs;render()},
 conn:v=>{readDraft();toggle(S.draft.connect,v);render()},
 int:v=>{toggle(S.draft.interests,v);render()},
 next1:()=>{readDraft();const d=S.draft;errs={};
  if(!d.name.trim())errs.name="Add your first name.";
  const ag=parseInt(d.age,10);
  if(!String(d.age).trim()||isNaN(ag))errs.age="Add your age.";
  else if(ag<18)errs.age="Friendly is for adults 18 and over.";
  else if(ag>110)errs.age="Check your age.";
  if(d.level==null)errs.level="Choose the level that sounds most like you.";
  if(!d.langs.length)errs.langs="Pick at least one language.";
  if(Object.keys(errs).length){render();const e=app.querySelector(".err");e&&e.scrollIntoView({block:"center",behavior:"smooth"});return}
  go("setup2")},
 finish:async()=>{
  const d=S.draft;if(d.interests.length<3||S.busy)return;
  S.busy=true;render();
  const {data,error}=await sb.from("profiles").upsert(toRow(d,S.user.id)).select().single();
  S.busy=false;
  if(error){render();toast("Couldn't save your profile: "+error.message);return}
  const was=S.editing;S.me=fromRow(data);S.editing=false;S.stack=[];S.route=was?"tab:me":"tab:discover";render(true);
  toast(was?"Profile updated.":"Profile saved. Welcome to Friendly!");
  if(!was)loadPeople();
 },
 edit:()=>{const m=S.me;S.draft={name:m.name,age:String(m.age),city:m.city,langs:[...m.langs],level:m.level,intro:m.intro,connect:[...m.connect],interests:[...m.interests]};S.editing=true;errs={};go("setup1")},
 fint:v=>{toggle(S.f.interests,v);render()},
 fcity:()=>{S.f.city=!S.f.city;render()},
 flevel:()=>{S.f.level=!S.f.level;render()},
 fclear:()=>{S.f={interests:[],lang:"",city:false,level:false};render()},
 open:v=>go("person:"+v),
 topic:v=>go("topic:"+v),
 tcat:v=>{S.tf.cat=v;render()},
 tmine:()=>{S.tf.mine=!S.tf.mine;render()},
 tall:()=>{S.tf.mine=false;render()},
 partner:()=>{S.f={interests:[],lang:"",city:false,level:true};tab("discover");toast("Showing people at a similar English level.")},
 copylink:async(v,t)=>{const inp=document.getElementById("invite-url");try{await navigator.clipboard.writeText(appUrl());toast("Link copied.")}catch(e){if(inp){inp.focus();inp.select()}toast("Press and hold the link to copy it.")}},
 askdelete:()=>sheet(`<h2>Delete your profile?</h2><p style="margin:0">Your profile will be removed and no one will see it. You'll be logged out. You can make a new profile later by logging in again.</p><button class="btn danger block" data-a="dodelete">Delete profile</button><button class="btn ghost block" data-a="close">Cancel</button>`),
 dodelete:async()=>{
  closeSheet();
  const {error}=await sb.from("profiles").delete().eq("id",S.user.id);
  if(error){toast("Couldn't delete: "+error.message);return}
  S.me=null;await sb.auth.signOut();toast("Your profile was deleted.");
 }
};

app.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||t.disabled)return;const fn=A[t.dataset.a];if(fn){e.preventDefault();fn(t.dataset.v,t,e)}});
app.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="authform")submitAuth();if(e.target.id==="passform")submitNewPass()});
app.addEventListener("change",e=>{if(e.target.id==="f-lang"){S.f.lang=e.target.value;render()}});
app.addEventListener("input",e=>{
 const f=e.target.dataset&&e.target.dataset.f;if(f){S.draft[f]=e.target.value}
 const af=e.target.dataset&&e.target.dataset.af;if(af){S.auth[af]=e.target.value}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

/* ---------- Start ---------- */
sb.auth.onAuthStateChange((event,session)=>{
 // Run outside the callback so Supabase calls inside onSession don't block it.
 setTimeout(()=>{
  if(event==="PASSWORD_RECOVERY"){S.user=session&&session.user;S.auth.msg=null;S.auth.password="";S.route="newpass";render(true);return}
  if(S.route==="newpass")return;
  if(event==="SIGNED_IN"||event==="SIGNED_OUT"||event==="INITIAL_SESSION")onSession(session);
 },0);
});
})();
</script>
</body>
</html>
